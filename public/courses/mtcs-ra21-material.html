ue los fundamentos de la ciberseguridad y los aplique a ese caso.<\/p><div class=\"hint\">💡 Cada diapositiva debe mencionar los datos de TU caso. Una idea por diapositiva y letra que se lea desde el fondo del salón.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Portada y concepto<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Diapositiva 1: título de tu presentación y tus datos.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Diapositiva 2: explica qué es la ciberseguridad con tus propias palabras.<\/span><\/label><h3>Principios (Bloque B)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Diapositiva 3: explica confidencialidad, integridad y disponibilidad con ejemplos.<\/span><\/label><h3>El caso (Bloques A y B)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Diapositiva 4: resume el caso asignado e identifica los recursos que necesitan protección.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Diapositiva 5: identifica amenazas internas, externas y vulnerabilidades presentes.<\/span><\/label><h3>Ataques (Bloque C)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Diapositiva 6: explica qué malware, engaño o ataque podría aprovechar esas debilidades.<\/span><\/label><h3>Protección (Bloque D)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Diapositiva 7: propón autenticación, permisos, cifrado u otros controles adecuados.<\/span><\/label><h3>Cierre y entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Diapositiva 8: conclusión y tres recomendaciones concretas.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Guarda tu presentación como PPTX o PDF y súbela en la actividad de la plataforma, junto con las respuestas escritas.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Portada y datos<\/td><td>10<\/td><\/tr><tr><td>Concepto de ciberseguridad<\/td><td>10<\/td><\/tr><tr><td>Principios con ejemplos<\/td><td>20<\/td><\/tr><tr><td>Caso y recursos a proteger<\/td><td>10<\/td><\/tr><tr><td>Amenazas y vulnerabilidades<\/td><td>15<\/td><\/tr><tr><td>Malware, engaño o ataque<\/td><td>10<\/td><\/tr><tr><td>Protección propuesta<\/td><td>15<\/td><\/tr><tr><td>Conclusión y recomendaciones<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un archivo PPTX o PDF con tu presentación de 8 diapositivas.<\/li><li>Se entrega en la actividad R.A. 2.1 de la plataforma, junto con las secciones escritas.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
