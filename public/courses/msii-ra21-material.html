n PowerShell. Registra todo en tu <b>reporte<\/b> y tu <b>listado de comandos<\/b>.<\/p><div class=\"hint\">💡 Antes de cada comando piensa: ¿dónde estoy?, ¿qué quiero lograr?, ¿ruta absoluta o relativa? Si no tienes laboratorio, usa los simuladores del material.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Preparación<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Portada con tu nombre, grupo y fecha; objetivo de la sesión en 2 líneas.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Abre el Símbolo del sistema y captura la información del equipo (VER, HOSTNAME, SYSTEMINFO).<\/span><\/label><h3>Gestión de directorios y archivos (CMD)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Crea en Documentos la estructura <b>Sucursal › Clientes, Precios, Respaldos<\/b> y muéstrala con TREE.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Crea 2 archivos con ECHO, cópialos y renómbralos usando al menos una <b>ruta absoluta<\/b> y una <b>relativa<\/b>.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Mueve un archivo a Respaldos y borra uno de prueba.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Respalda la carpeta Precios en la USB (unidad D: o E:) y comprueba con DIR.<\/span><\/label><h3>Configuración<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Muestra 3 variables de entorno y crea la variable SUCURSAL con SETX; compruébala en una ventana nueva.<\/span><\/label><h3>PowerShell<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Repite con cmdlets: lista la carpeta Sucursal, crea Reportes con New-Item y un archivo con Set-Content.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Muestra los 5 procesos con más CPU y los servicios activos.<\/span><\/label><h3>Reporte y listado<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>10.<\/b> Reporte: capturas en orden, cada una con qué hiciste y qué resultado obtuviste.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>11.<\/b> Listado de comandos en tabla: comando, para qué sirve y el ejemplo exacto que ejecutaste.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>12.<\/b> Conclusión: ¿cuándo conviene usar comandos y cuándo ventanas?<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Información del equipo<\/td><td>10<\/td><\/tr><tr><td>Estructura de carpetas y TREE<\/td><td>15<\/td><\/tr><tr><td>Archivos con rutas absolutas y relativas<\/td><td>20<\/td><\/tr><tr><td>Respaldo en la USB<\/td><td>10<\/td><\/tr><tr><td>Variables de entorno<\/td><td>10<\/td><\/tr><tr><td>PowerShell: cmdlets y tubería<\/td><td>15<\/td><\/tr><tr><td>Reporte con capturas explicadas<\/td><td>10<\/td><\/tr><tr><td>Listado de comandos completo<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un solo archivo PDF o Word con el reporte y el listado.<\/li><li>Nombre del archivo: Apellido_Nombre_Sesion_MSII21.<\/li><li>Súbelo en la actividad R.A. 2.1 de la plataforma.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
