pL("🌍","¿Cómo funciona internet?","Bloque B · Red, dirección IP y dominio",sp("En palabras sencillas","<b>Internet</b> es la red mundial que une millones de redes. Cada equipo conectado tiene una <b>dirección IP</b>, como un número de teléfono (por ejemplo <code>201.175.40.10</code>).")+bk("Dominio","Como nadie recuerda números, usamos <b>nombres de dominio</b>: <code>conalep.edu.mx</code>. Se lee de derecha a izquierda: <b>.mx</b> = México, <b>.edu</b> = educación, <b>conalep</b> = la institución. Otros: <code>.gob.mx</code> (gobierno), <code>.com</code> (comercial), <code>.org</code> (organizaciones).","")+bk("DNS","El <b>DNS</b> es la agenda de internet: traduce el dominio a su dirección IP. Si escribes mal el dominio, el DNS no lo encuentra y el navegador dice «No se puede acceder a este sitio».","")+bk("WWW","La <b>World Wide Web</b> es el conjunto de páginas enlazadas que ves con el navegador. Internet es la carretera; la Web es uno de los servicios que viajan por ella (el correo y la mensajería son otros).","")+ex("Ejemplo","Escribes <code>www.conalep.edu.mx</code> → el DNS responde <code>201.175.40.10</code> → tu navegador se conecta a esa IP → el servidor le manda la página."),"Dominio para las personas, IP para las máquinas, DNS para traducir."),
pL("🔐","Protocolos: las reglas para hablar","Bloque B · HTTP, HTTPS, FTP y DNS",sp("En palabras sencillas","Un <b>protocolo</b> es un conjunto de reglas para que dos equipos se entiendan. La primera parte de la dirección dice qué protocolo se usa.")+bk("HTTP","Protocolo de la Web. Manda las páginas <b>sin cifrar</b>: quien esté en tu misma red wifi podría leer lo que escribes. El navegador lo marca como <b>«No seguro»</b>.","")+bk("HTTPS","HTTP + cifrado (TLS). Muestra el <b>candado 🔒</b>. Es obligatorio para escribir contraseñas, datos personales o de pago.","")+bk("FTP","Protocolo para <b>transferir archivos</b> entre tu equipo y un servidor. Se usa con programas como FileZilla. Su versión segura es SFTP.","")+bk("DNS","Protocolo que traduce nombres de dominio a direcciones IP.","")+bk("Ojo","El candado solo dice que la conexión está cifrada, <b>no</b> que el sitio sea honesto. Un sitio falso también puede tener candado: revisa siempre el <b>dominio</b>.","wn"),"HTTP = postal abierta · HTTPS = sobre cerrado · FTP = mudanza de archivos · DNS = agenda."),

pL("🔎","Motores de búsqueda","Bloque E · Buscadores, opciones y tipos de búsqueda",sp("En palabras sencillas","Un <b>motor de búsqueda</b> (Google, Bing, DuckDuckGo) revisa millones de páginas y te muestra las que coinciden con tus palabras. Mientras mejores palabras uses, mejores resultados.")+bk("Búsqueda simple","Pocas palabras clave, sin artículos: <code>becas conalep requisitos</code>.","")+bk("Búsqueda avanzada con operadores","<code>\"beca benito juárez\"</code> frase exacta · <code>site:gob.mx</code> solo en sitios de gobierno · <code>filetype:pdf</code> solo documentos PDF · <code>-memes</code> quita una palabra · <code>phishing OR pharming</code> una u otra.","")+bk("Restringir resultados","Las pestañas <b>Imágenes, Videos, Noticias</b> y la opción <b>Herramientas › Último año</b> limitan por tipo y fecha. Muchos buscadores tienen una página de <b>Búsqueda avanzada</b> con estos mismos filtros.","")+bk("¿Es confiable?","Prefiere sitios oficiales (<code>.gob.mx</code>, <code>.edu.mx</code>), con autor y fecha recientes. Compara al menos dos fuentes. Desconfía de lo que pide dinero o datos.","")+ex("Ejemplo","<code>becas</code> da cientos de resultados. <code>\"beca benito juarez\" site:gob.mx filetype:pdf</code> da la convocatoria oficial en PDF."),"Palabras clave + operadores + filtros = la fuente correcta."),

pL("🦠","Riesgos en internet","Bloque F · Malware, spam, intrusos, piratería y fraudes",bk("Malware","Programa malicioso: <b>virus</b> (se pega a archivos), <b>gusano</b> (se copia solo por la red), <b>troyano</b> (se disfraza de programa útil), <b>ransomware</b> (secuestra tus archivos y pide rescate) y <b>spyware</b> (espía).","")+bk("Spam","Correo masivo no solicitado. Puede traer enlaces de fraude o adjuntos con malware.","")+bk("Intrusos","Personas que intentan entrar a tu equipo o a tus cuentas: adivinan contraseñas o aprovechan equipos sin actualizar.","")+bk("Piratería","Copiar o descargar software, música o películas <b>sin permiso</b> del autor. Es ilegal y es la vía favorita para colar malware («crack», «keygen»).","")+bk("Phishing","Engaño por <b>correo o mensaje</b> que te lleva a un sitio falso para robar tus datos. Variantes: <b>smishing</b> (SMS) y <b>vishing</b> (llamada).","")+bk("Pharming","El atacante cambia la traducción del DNS: escribes bien la dirección, pero llegas a un sitio falso. Por eso revisa el candado y el certificado.","")+bk("Fraude y robo de información","Ventas falsas, premios inexistentes, suplantación de identidad. Con tu nombre, CURP y fotos alguien puede hacerse pasar por ti.",""),"Si suena demasiado bueno, urgente o pide datos: es sospechoso."),
