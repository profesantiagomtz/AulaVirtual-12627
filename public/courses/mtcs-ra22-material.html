var PR=[{"id": "pr1", "n": 1, "t": "Comprueba la integridad con hash", "prog": "Bloque A · Algoritmos de hash e integridad de archivos", "min": 50, "lug": "Laboratorio, lunes 26-oct (primera hora) o en tu celular", "modes": {"pc": {"mat": ["Computadora con Windows", "PowerShell y Símbolo del sistema (ya vienen en Windows)", "Un documento de Word o de Google para pegar tus capturas", "Objetivo: comprobar con tus propios ojos las 3 reglas del hash"], "steps": [["Abre <b>PowerShell<\/b>: presiona la tecla Windows, escribe PowerShell y da Enter. Luego escribe <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">cd Documents<\/code> y presiona Enter.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Los comandos trabajan con los archivos de la carpeta en la que estás parado. Así tu archivo quedará en Documentos y lo encontrarás fácil.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si dice que no encuentra la ruta, prueba con <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">cd Documentos<\/code>.<\/span>", "ps_abrir"], "Crea el archivo escribiendo: <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">Set-Content expediente.txt &quot;Ana Lopez - alergia a la penicilina&quot;<\/code> y Enter.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Necesitamos un archivo para sacarle su huella. Lo escribimos sin acentos para que todos los programas lean exactamente las mismas letras.<\/span>", ["Calcula su huella con <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">Get-FileHash expediente.txt<\/code>. Toma captura y copia en tu tabla los <b>primeros 8 caracteres<\/b> del hash.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Esta es la huella «original». Get-FileHash usa SHA-256 sin que se lo pidas. Con 8 caracteres basta para comparar, porque si algo cambia, cambia casi todo.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si sale «no se encuentra el archivo», revisa que estés en Documents (paso 1) y que el nombre esté bien escrito. Si el hash sale cortado con «…», usa <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">Get-FileHash expediente.txt | Format-List<\/code>: lo muestra completo en un renglón.<\/span>", "hash_ps"], ["Abre el <b>Símbolo del sistema<\/b> (tecla Windows → escribe cmd → Enter), escribe <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">cd Documents<\/code> y luego <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">certutil -hashfile expediente.txt SHA256<\/code>. Compara con el hash del paso 3.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Son dos programas distintos, pero SHA-256 es un estándar: el mismo archivo debe dar la misma huella sin importar qué programa la calcule (regla 1).<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> certutil la muestra en minúsculas y PowerShell en MAYÚSCULAS: son la misma huella. Si no pusiste SHA256 al final, certutil usa otro algoritmo y sale distinta.<\/span>", "certutil"], ["Cambia <b>una sola letra<\/b>: <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">Set-Content expediente.txt &quot;Ana Lopez - alergia a la penicilinA&quot;<\/code> y vuelve a usar <code style=\"font-family:Consolas,monospace;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:1px 5px;border-radius:5px\">Get-FileHash expediente.txt<\/code>. Anótalo en tu tabla.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Así compruebas la regla 2: con un cambio mínimo, la huella cambia casi completa. Es la prueba de que el hash detecta cualquier alteración.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si el hash salió igual, el cambio no se guardó: vuelve a escribir el comando Set-Content con la A mayúscula al final.<\/span>", "hash_cambio"], "Regresa el texto original (el comando del paso 2) y calcula la huella otra vez. Anota si coincide con la del paso 3.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Si vuelve a coincidir, demuestras que la huella depende SOLO del contenido. Así es como se verifica que un archivo no fue modificado.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si no coincide, revisa letra por letra: un espacio de más, un acento o una mayúscula ya cuentan como cambio.<\/span>", ["Busca en internet una página de descarga que publique el <b>SHA-256<\/b> de su archivo (por ejemplo, la de VLC muestra «SHA-256 checksum»). Toma captura y explica en 2 renglones para qué sirve.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Comparar el hash publicado con el de tu archivo descargado te asegura que bajaste el original y no una copia modificada con virus.<\/span>", "descarga_hash"], "Escribe 4 renglones para tu organización completando estas frases: <b>1)<\/b> «El archivo más importante que protegería es…» <b>2)<\/b> «Calcularía su huella original cuando…» <b>3)<\/b> «Guardaría esa huella en…» <b>4)<\/b> «Si la huella ya no coincide, haría…»<span class=\"why\">🤔 <b>¿Por qué?<\/b> Es exactamente lo que vas a necesitar en la sección «Integridad» de tu reporte. Las frases te guían para que no se te olvide ninguna parte. Si no sabes qué escribir, regresa al «Ejemplo resuelto: descubrir si alguien cambió un expediente»: tiene las 4 partes.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Tu organización está en la actividad de evaluación R.A. 2.2 de la plataforma, en el recuadro «Datos asignados».<\/span>"]}, "cel": {"mat": ["Celular", "Este material: pestaña Diagnostica → Laboratorio de hash", "Documentos de Google o notas para tu reporte", "Objetivo: comprobar con tus propios ojos las 3 reglas del hash"], "steps": [["Abre <b>Diagnostica → Laboratorio de hash<\/b>. Deja el texto que trae y toma captura de su huella.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Esta es la huella «original» con la que vas a comparar todo lo demás.<\/span>", "hash_cel"], ["Cambia <b>una sola letra<\/b> (por ejemplo «Ana» por «Ena») y toma captura de cuántos caracteres de la huella cambiaron.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Así compruebas la regla 2: con un cambio mínimo, la huella cambia casi completa.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si no ves el aviso de cuántos cambiaron, escribe y borra una letra otra vez: se calcula al escribir.<\/span>", "hash_cel"], "Regresa la letra original y comprueba que la huella vuelve a ser la de tu primera captura.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Regla 1: el mismo texto siempre da la misma huella. Así se verifica que algo no cambió.<\/span>", ["Activa la casilla <b>Agregar sal<\/b>, escribe una contraseña de prueba (no la tuya), quita y vuelve a activar la sal. Explica por qué cambia la huella aunque la contraseña sea la misma.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Cada vez que se activa, la sal es un valor al azar distinto que se pega antes del texto; lo que entra al hash es diferente y por eso sale otra huella. Es justo lo que protege a dos usuarios con la misma contraseña.<\/span>", "hash_cel"], ["Busca en internet una página de descarga que publique el <b>SHA-256<\/b> de su archivo (por ejemplo, la de VLC muestra «SHA-256 checksum»). Toma captura y explica en 2 renglones para qué sirve.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Comparar el hash publicado con el del archivo descargado te asegura que bajaste el original y no una copia modificada con virus.<\/span>", "descarga_hash"], "Escribe 4 renglones para tu organización completando estas frases: <b>1)<\/b> «El archivo más importante que protegería es…» <b>2)<\/b> «Calcularía su huella original cuando…» <b>3)<\/b> «Guardaría esa huella en…» <b>4)<\/b> «Si la huella ya no coincide, haría…»<span class=\"why\">🤔 <b>¿Por qué?<\/b> Es exactamente lo que vas a necesitar en la sección «Integridad» de tu reporte. Las frases te guían para que no se te olvide ninguna parte. Si no sabes qué escribir, regresa al «Ejemplo resuelto: descubrir si alguien cambió un expediente»: tiene las 4 partes.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Tu organización está en la actividad de evaluación R.A. 2.2 de la plataforma, en el recuadro «Datos asignados».<\/span>"]}}, "entrega": ["Capturas y tabla de pruebas dentro de tu reporte.", "Revisa tus resultados con el botón «¿Voy bien?» (arriba del material) antes de entregar."], "rub": [["Hash calculado correctamente", 25], ["Prueba con una letra cambiada", 25], ["Explicación de la descarga verificada", 20], ["Aplicación a la organización", 30]]}, {"id": "pr2", "n": 2, "t": "Plan de disponibilidad y respuesta a incidentes", "prog": "Bloque B · Alta disponibilidad, respuesta a incidentes y recuperación", "min": 100, "lug": "Aula, casa o celular (semana del 26-oct al 2-nov)", "modes": {"pc": {"mat": ["Word o Documentos de Google", "Tu organización asignada en la actividad de evaluación de la plataforma", "La calculadora de disponibilidad (pestaña Diagnostica) para revisar tus cuentas"], "steps": ["Escribe en tu documento <b>3 servicios<\/b> de tu organización asignada (por ejemplo: cobro, página web, archivos de clientes).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Primero hay que saber QUÉ se quiere mantener funcionando; sin eso no se puede proteger nada.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Los datos de tu organización están en la actividad de evaluación R.A. 2.2 de la plataforma (número de usuarios, equipos, incidente y tiempo máximo sin servicio).<\/span>", ["Para cada servicio hazte la pregunta: <b>«si esta pieza se descompone, ¿se cae el servicio y no hay otra igual?»<\/b> Anota esa pieza como su punto único de falla.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Un punto único de falla es justamente eso: algo sin repuesto que detiene todo. La pregunta te ayuda a encontrarlo sin adivinar.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Piensa en: el disco, la luz, el internet, el servidor o una sola persona que sabe usar el sistema.<\/span>", "tabla_disp"], "En la misma tabla escribe el <b>repuesto (redundancia)<\/b> de cada punto de falla: RAID, UPS, segundo proveedor, otro servidor…<span class=\"why\">🤔 <b>¿Por qué?<\/b> Eliminar un punto único de falla = ponerle repuesto. Usa la actividad «¿Qué mecanismo usarías?» como guía.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si tu punto de falla es una persona (solo ella sabe usar el sistema), su repuesto es capacitar a otra persona.<\/span>", ["Calcula cuántas horas al año podría estar caído su servicio principal con <b>99 %<\/b> y con <b>99.9 %<\/b>. Escribe los <b>4 pasos<\/b>, no solo el resultado.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Escribir los pasos demuestra que entiendes de dónde sale el número; además, si te equivocas, tu profe puede ver en qué paso fue.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si te sale un número enorme (como 8,672), multiplicaste por 99 en lugar de por lo que NO funciona. Revisa con la calculadora de disponibilidad en Diagnostica: 99 % → 87.6 h y 99.9 % → 8.76 h.<\/span>", "calc_pasos"], "Elige <b>cada cuánto respaldarías<\/b> 2 servicios y escribe su <b>RPO<\/b>: es igual al tiempo entre respaldos (respaldo diario → RPO 24 h; cada hora → RPO 1 h).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Lo que se perdería en el peor caso es todo lo hecho desde el último respaldo; por eso el RPO sale de la frecuencia del respaldo.<\/span>", ["Escribe el <b>RTO<\/b> de esos 2 servicios: un tiempo <b>igual o menor<\/b> al tiempo máximo sin servicio que acepta tu organización.<span class=\"why\">🤔 <b>¿Por qué?<\/b> El RTO no se calcula, se decide: es la promesa de en cuánto tiempo vuelves. Si fuera mayor de lo que tu organización aguanta, el plan no serviría.<\/span>", "rpo_rto"], ["Escribe <b>una oración por cada una de las 4 fases<\/b> de respuesta para el incidente de tu organización: Preparación, Detección y análisis, Contención-erradicación-recuperación, Lecciones aprendidas.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Una oración por fase te obliga a pensar qué se hace en cada momento y en el orden correcto: antes, darse cuenta, detener y reparar, aprender.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si no sabes qué escribir en una fase, regresa a la lección «Respuesta a incidentes»: cada fase tiene su ejemplo.<\/span>", "incidente"], "Explica en 3 renglones cómo aplicarías la <b>defensa en profundidad<\/b>: menciona al menos 3 capas, una detrás de otra (por ejemplo: capacitación → antivirus → respaldos).<span class=\"why\">🤔 <b>¿Por qué?<\/b> La idea es demostrar que no confías en una sola protección: si una falla, la siguiente detiene el problema.<\/span>"]}, "cel": {"mat": ["Documentos de Google o notas", "Tu organización asignada en la actividad de evaluación de la plataforma", "La calculadora de disponibilidad (pestaña Diagnostica) para revisar tus cuentas"], "steps": ["Escribe en tu documento <b>3 servicios<\/b> de tu organización asignada (por ejemplo: cobro, página web, archivos de clientes).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Primero hay que saber QUÉ se quiere mantener funcionando; sin eso no se puede proteger nada.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Los datos de tu organización están en la actividad de evaluación R.A. 2.2 de la plataforma (número de usuarios, equipos, incidente y tiempo máximo sin servicio).<\/span>", ["Para cada servicio hazte la pregunta: <b>«si esta pieza se descompone, ¿se cae el servicio y no hay otra igual?»<\/b> Anota esa pieza como su punto único de falla.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Un punto único de falla es justamente eso: algo sin repuesto que detiene todo. La pregunta te ayuda a encontrarlo sin adivinar.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Piensa en: el disco, la luz, el internet, el servidor o una sola persona que sabe usar el sistema.<\/span>", "tabla_disp"], "En la misma tabla escribe el <b>repuesto (redundancia)<\/b> de cada punto de falla: RAID, UPS, segundo proveedor, otro servidor…<span class=\"why\">🤔 <b>¿Por qué?<\/b> Eliminar un punto único de falla = ponerle repuesto. Usa la actividad «¿Qué mecanismo usarías?» como guía.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si tu punto de falla es una persona (solo ella sabe usar el sistema), su repuesto es capacitar a otra persona.<\/span>", ["Calcula cuántas horas al año podría estar caído su servicio principal con <b>99 %<\/b> y con <b>99.9 %<\/b>. Escribe los <b>4 pasos<\/b>, no solo el resultado.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Escribir los pasos demuestra que entiendes de dónde sale el número; además, si te equivocas, tu profe puede ver en qué paso fue.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si te sale un número enorme (como 8,672), multiplicaste por 99 en lugar de por lo que NO funciona. Revisa con la calculadora de disponibilidad en Diagnostica: 99 % → 87.6 h y 99.9 % → 8.76 h.<\/span>", "calc_pasos"], "Elige <b>cada cuánto respaldarías<\/b> 2 servicios y escribe su <b>RPO<\/b>: es igual al tiempo entre respaldos (respaldo diario → RPO 24 h; cada hora → RPO 1 h).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Lo que se perdería en el peor caso es todo lo hecho desde el último respaldo; por eso el RPO sale de la frecuencia del respaldo.<\/span>", ["Escribe el <b>RTO<\/b> de esos 2 servicios: un tiempo <b>igual o menor<\/b> al tiempo máximo sin servicio que acepta tu organización.<span class=\"why\">🤔 <b>¿Por qué?<\/b> El RTO no se calcula, se decide: es la promesa de en cuánto tiempo vuelves. Si fuera mayor de lo que tu organización aguanta, el plan no serviría.<\/span>", "rpo_rto"], ["Escribe <b>una oración por cada una de las 4 fases<\/b> de respuesta para el incidente de tu organización: Preparación, Detección y análisis, Contención-erradicación-recuperación, Lecciones aprendidas.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Una oración por fase te obliga a pensar qué se hace en cada momento y en el orden correcto: antes, darse cuenta, detener y reparar, aprender.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si no sabes qué escribir en una fase, regresa a la lección «Respuesta a incidentes»: cada fase tiene su ejemplo.<\/span>", "incidente"], "Explica en 3 renglones cómo aplicarías la <b>defensa en profundidad<\/b>: menciona al menos 3 capas, una detrás de otra (por ejemplo: capacitación → antivirus → respaldos).<span class=\"why\">🤔 <b>¿Por qué?<\/b> La idea es demostrar que no confías en una sola protección: si una falla, la siguiente detiene el problema.<\/span>"]}}, "entrega": ["Tablas y respuestas dentro de tu reporte.", "Revisa tus números con el botón «¿Voy bien?» (arriba del material) antes de entregar."], "rub": [["Puntos de falla y redundancia", 25], ["Cálculo de disponibilidad", 15], ["RPO y RTO bien definidos", 25], ["Fases del incidente", 25], ["Defensa en profundidad", 10]]}, {"id": "pr3", "n": 3, "t": "Revisa la defensa de un equipo y busca vulnerabilidades", "prog": "Bloques C y D · Protección del host y dominio de vulnerabilidades", "min": 100, "lug": "Laboratorio, viernes 6-nov o en tu celular", "modes": {"pc": {"mat": ["Computadora con Windows", "Navegador", "Documento para tu reporte"], "steps": [["Abre <b>Seguridad de Windows<\/b> (tecla Windows → escribe «Seguridad de Windows» → Enter). Toma captura y anota el estado de cada sección: ✅ verde = bien, ⚠️ amarillo = hay algo pendiente.<span class=\"why\">🤔 <b>¿Por qué?<\/b> Es la forma más rápida de ver si el equipo (host) tiene antivirus, firewall y protección de cuentas activos.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Si una sección tiene ⚠️, da clic en ella: Windows te dice qué falta. Anótalo, no tienes que arreglarlo en la escuela.<\/span>", "seg_win"], ["Haz una tabla con <b>6 medidas del host<\/b> y cómo comprobaste cada una: <b>1)<\/b> Actualizaciones: Configuración → Windows Update. <b>2)<\/b> Antivirus y <b>3)<\/b> Firewall: Seguridad de Windows. <b>4)<\/b> Tipo de cuenta: Configuración → Cuentas → Tu información (dice «Administrador» o «Estándar»). <b>5)<\/b> Bloqueo automático: Configuración → Personalización → Pantalla de bloqueo. <b>6)<\/b> Cifrado: busca «BitLocker».<span class=\"why\">🤔 <b>¿Por qué?<\/b> Cada medida tapa una forma distinta de atacar al equipo (lección «Protección del host»). La evidencia demuestra que sí la revisaste y no la inventaste.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> En Windows Home no existe BitLocker: anota «No disponible en esta versión». Que algo NO se cumpla también es un resultado válido: escribe ❌ y qué propones.<\/span>", "checklist_host"], ["Entra a <b>nvd.nist.gov/vuln/search<\/b> → en <b>Keyword Search<\/b> escribe el nombre de un programa que uses (7-Zip, Chrome, Zoom…) → <b>Search<\/b> → abre un resultado. Anota su <b>CVE<\/b>, su calificación <b>CVSS<\/b> (Base Score) y la <b>solución<\/b> (busca «before» o «prior to» en la descripción, como viste en la lección «Vulnerabilidades: CVE y CVSS»).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Así practicas lo que hace un especialista: encontrar fallas públicas de los programas que usa su organización y decidir cuáles corregir primero según su gravedad.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> La página está en inglés: da clic derecho → «Traducir al español». HIGH = alta, CRITICAL = crítica, MEDIUM = media, LOW = baja. Si aparecen dos calificaciones, anota la primera y di de qué versión es (por ejemplo «CVSS 3.1»). Si dice «N/A» o «not yet provided», abre otro resultado.<\/span>", "nvd_buscar"], ["Escribe la gravedad de tu CVE con la escala (Baja · Media · Alta · Crítica) y explica <b>en cuánto tiempo<\/b> la corregirías.<span class=\"why\">🤔 <b>¿Por qué?<\/b> La calificación sirve para decidir qué se arregla primero. Usa la guía de la lección: Crítica → hoy (máximo 2 días) · Alta → esta semana · Media → este mes · Baja → siguiente mantenimiento.<\/span>", "cve"], "Propón <b>una medida de servidor, una de red y una física<\/b> para tu organización, con la fórmula «capa + medida + para qué sirve».<span class=\"why\">🤔 <b>¿Por qué?<\/b> Con la revisión del host ya tienes la primera capa; con estas tres completas las 4 capas que pide el reporte.<\/span>", "Escribe <b>3 principios éticos<\/b> que seguirías si te contrataran para revisar esa organización (por ejemplo: «Solo revisaría con permiso por escrito porque…»).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Agregar el «porque» demuestra que sabes la razón de cada principio, no solo su nombre.<\/span>"]}, "cel": {"mat": ["Celular", "Navegador", "Documento o notas para tu reporte"], "steps": [["Abre <b>Ajustes<\/b> en tu celular y revisa: bloqueo de pantalla, protección contra apps dañinas (Play Protect o equivalente) y fecha del parche de seguridad (Ajustes → Acerca del teléfono). Haz tu lista con ✅ o ❌: el parche lleva ✅ si tiene <b>3 meses o menos<\/b> (regla de la lección «Protección del host»).<span class=\"why\">🤔 <b>¿Por qué?<\/b> Tu celular también es un host. Revisarlo te enseña las mismas medidas que se revisan en una computadora.<\/span><span class=\"why ojo\">⚠️ <b>Si algo no sale:<\/b> Cada marca de celular acomoda distinto los menús: usa la lupa de Ajustes y busca «bloqueo», «Play Protect» o «parche».<\/span>", "cel_checklist"], ["Entra a <b>nvd.nist.gov/vuln/search<\/b> → en <b>Keyword Search<\/b> escribe «Android» o el nombre de una app que uses → <b>Search<\/b> → abre un resultado. Anota su <b>CVE<\/b>, su <b>CVSS<\/b> (Base Score) y la <b>solución<\/b> (busca «before» o «prior to» en la descripción, como viste en la /* Nombre y grupo del alumno: primero la sesión de la plataforma (mismo origen), luego lo que escribió en «Mi entrega». */
function alumno(){var s=null;try{s=JSON.parse(localStorage.getItem("aula-session")||"null")}catch(e){}
 var st=s&&s.role=="student"&&(!s.id||SID=="local"||s.id==SID)?s:{};
 return {name:(st.name||ST.nm||"").trim(),group:(st.group&&st.group!="Sin asignar"?st.group:ST.gr||"").trim()}}
function hoy(){try{return new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}catch(e){return new Date().toISOString().slice(0,10)}}

 ORDER.forEach(function(id){var S=SC(id),C=CH[id]||{};if(/Introducci/.test(C.k||""))return;var n=0,part='';
  var L=C.l||"",head='<div class="inc"><span class="l">'+L+')</span><span class="t"><small>Inciso</small>'+(C.t||"")+'</span></div>';
  lessonIdx(S).forEach(function(i){var t=topic(P[i],(C.l||"")+"."+(n+1),n?"":head);if(t){n++;part+=t}});
  if(part)idx+='<span><b>'+L+')</b>'+(C.t||"")+'</span>';h+=part});
 var mod=B.mod+(B.modName?' · '+B.modName:'');
 return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apuntes '+txt(B.mod+' '+B.ra)+'</title><style>'+CSS+'\n'+illCss()+'</style></head><body>'+

  '<div class="sheet"><div class="top"><span>'+txt(mod)+'</span><span>Apuntes</span></div>'+
  '<div class="cover"><div class="ra"><small>R.A.</small><b>'+txt(B.ra.replace(/^R\.A\.\s*/,""))+'</b></div><h1>'+txt(B.raName)+'</h1></div>'+
  '<div class="who"><div><small>Alumno</small><b>'+txt(A.name)+'</b></div><div><small>Grupo</small><b>'+txt(A.group)+'</b></div><div><small>Fecha de descarga</small><b>'+hoy()+'</b></div></div>'+
  '<div class="idx"><span>Contenido</span>'+idx+'</div>'+
  '<div class="flow">'+h+'</div><div class="foot"><span>'+txt(B.mod+' · '+B.ra+' · '+B.raName)+'</span><span><em>Ing. Santiago Martínez González</em><b>AulaVirtual</b></span></div></div></body></html>'}
