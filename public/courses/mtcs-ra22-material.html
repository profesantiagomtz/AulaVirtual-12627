mas. No empiezas de cero: tus tres prácticas ya tienen casi todo.<\/p><div class=\"hint\">💡 Responde siempre para TU organización: cada sección debe mencionar sus datos (servicios, incidente y tiempo sin servicio). Usa la fórmula «qué haría + para qué sirve».<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Contexto<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Describe la organización asignada, la información que maneja y los servicios que no pueden detenerse (lo tienes del paso 1 de la Práctica 2).<\/span><\/label><h3>Integridad (Bloque A)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Explica cómo usarías hash con sal, HMAC o firma digital y certificados, y cómo cuidarías la integridad de su base de datos (usa tus 4 renglones de la Práctica 1).<\/span><\/label><h3>Estándar (Bloque B)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Propón redundancia para sus puntos únicos de falla y calcula su disponibilidad con los 4 pasos (Práctica 2).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Define respaldos, RPO y RTO; el RTO no puede ser mayor que el tiempo máximo sin servicio.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Describe las 4 fases de respuesta para su incidente reciente, una oración por fase.<\/span><\/label><h3>Defensa de sistemas (Bloque C)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Medidas para host, servidor, red y seguridad física, cada una con su «para qué sirve» (Práctica 3).<\/span><\/label><h3>Dominio (Bloque D)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Una vulnerabilidad real (CVE y CVSS) que afectaría a la organización y cómo la corregirías.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Principios éticos y herramientas que usarías con autorización.<\/span><\/label><h3>Entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Llena las secciones de la actividad en la plataforma y adjunta tu reporte en PDF.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Contexto de la organización<\/td><td>10<\/td><\/tr><tr><td>Controles de integridad<\/td><td>20<\/td><\/tr><tr><td>Disponibilidad, RPO/RTO y respuesta al incidente<\/td><td>25<\/td><\/tr><tr><td>Defensa de sistemas en 4 capas<\/td><td>20<\/td><\/tr><tr><td>Vulnerabilidad, ética y herramientas<\/td><td>15<\/td><\/tr><tr><td>Redacción y presentación<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un archivo PDF con tu reporte.<\/li><li>Se entrega en la actividad R.A. 2.2 de la plataforma, junto con las secciones escritas.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";

ue el servicio regrese: RTO.", "No podemos perder más de un día de cobros": "«Perder cobros» = perder <b>datos<\/b>: RPO.", "El sistema de cobro puede estar caído máximo medio día": "«Estar caído» = <b>tiempo<\/b> sin servicio: RTO.", "Que falle un disco del servidor": "Falla un disco → el repuesto es otro disco con la misma información (RAID 1).", "Que se vaya la luz": "Falla la energía → el repuesto es una batería (UPS) o una planta.", "Que se caiga el internet": "Falla el internet → el repuesto es otro proveedor.", "Que un solo servidor no aguante tantas visitas": "El problema es el exceso de visitas → se reparten entre varios servidores.", "Que se incendie la clínica": "Se pierde todo el edificio → la única copia que sobrevive es la que está fuera.", "Cifrar el disco de la laptop del dentista": "Protege a un solo equipo que usa una persona: host.", "Desactivar en el servidor los servicios que no se usan": "Se hace en la computadora que atiende a todos: servidor.", "Separar el wifi de pacientes de la red interna": "Cambia cómo se conectan los equipos: red (segmentación).", "Poner llave al cuarto del servidor": "Una llave y una puerta se pueden tocar: física.", "Instalar un IDS que avise de tráfico raro": "Vigila lo que viaja por la conexión: red.", "Usar cuenta estándar en la PC de recepción": "Es una configuración de ese equipo: host.", "Instalar un no-break para el servidor": "Protege la energía, que es algo físico (el caso con truco).", "Dejar abierto el escritorio remoto del servidor a todo internet": "Abre una puerta a cualquier persona del mundo. Lo correcto es entrar por VPN.", "Usar WPA3 con contraseña fuerte en la red interna": "Cierra la puerta: cifra el wifi y no deja entrar a desconocidos.", "Que todos usen la cuenta de administrador para ir más rápido": "Da llave maestra a todos; si entra un virus, puede hacer de todo.", "Tirar a la basura un disco viejo con expedientes sin borrarlo": "Cualquiera que lo encuentre podría recuperar los datos.", "Revisar cada semana las bitácoras del servidor": "Permite ver a tiempo si alguien entró sin permiso.", "CVE con CVSS 9.8": "9.8 está entre 9.0 y 10: crítica.", "CVE con CVSS 5.3": "5.3 está entre 4.0 y 6.9: media.", "CVE con CVSS 7.5": "7.5 está entre 7.0 y 8.9: alta.", "CVE con CVSS 2.1": "2.1 está entre 0.1 y 3.9: baja.", "CVE con CVSS 10.0": "10 es la calificación máxima: crítica.", "Escanear la red de la escuela por curiosidad, sin pedir permiso": "Falla la pregunta 1: no hay permiso por escrito, aunque sea «por curiosidad».", "Reportar al dueño una falla que encontraste en su página": "Es avisar de forma responsable: ayuda a corregirla.", "Publicar en redes los datos de pacientes que viste en una auditoría": "Falla la pregunta 2: viola la privacidad.", "Hacer una prueba de penetración con contrato firmado": "Tiene permiso por escrito y reglas claras.", "Usar la contraseña de un compañero que dejó su sesión abierta": "Es usar una cuenta ajena sin permiso, aunque esté abierta.", "Saber qué puertos tiene abiertos el servidor de la clínica": "Palabra clave «puertos» → Nmap.", "Ver qué tráfico sale de la PC de recepción": "Palabra clave «tráfico» → Wireshark.", "Revisar un archivo adjunto sospechoso": "Palabra clave «archivo» → VirusTotal lo revisa con decenas de antivirus.", "Buscar fallas conocidas (CVE) en todos los equipos": "Palabra clave «fallas» → escáner de vulnerabilidades.", "Guardar contraseñas distintas para cada sistema": "Palabra clave «contraseñas» → gestor de contraseñas."};

function pHash(){K++;return '<article class="lesson"><header><span class="kick">🧪 Herramienta</span><h1>Laboratorio de hash</h1><p class="sub">Aquí puedes ver con tus propios ojos cómo funciona un hash. No se califica: es para experimentar.</p></header><div class="co co-def"><div class="co-l">Cómo usarlo (3 pasos)</div><p><b>1.</b> Mira la huella que sale abajo para el texto que ya está escrito.<br><b>2.</b> Cambia una sola letra (por ejemplo «Ana» por «Ena») y observa cuántos caracteres de la huella cambian.<br><b>3.</b> Activa la casilla de la sal y vuelve a escribir: aunque el texto sea el mismo, la huella cambia porque se le agregó un valor al azar.</p></div><div class="hashlab czf"><label>Texto (puede ser una contraseña de prueba o un dato del expediente)<textarea class="hx" rows="2">Ana López · alergia a la penicilina</textarea></label><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" class="hs"> Agregar sal (un valor aleatorio antes del texto)</label><div class="co co-def"><div class="co-l">Huella SHA-256 (siempre 64 caracteres)</div><p class="ho" style="font-family:Consolas,monospace;word-break:break-all;margin:0"></p></div><p class="hn" style="font-size:14.5px;color:var(--mut)"></p></div><p class="take"><b>¿Qué debes notar?</b> Mismo texto = misma huella. Una letra distinta = huella casi completamente distinta. Por eso el hash sirve para descubrir si alguien cambió algo.</p></article>'}
function hashInit(d){var x=d.querySelector(".hx"),s=d.querySelector(".hs"),o=d.querySelector(".ho"),n=d.querySelector(".hn"),prev=null,salt="";
 function hex(b){return [].map.call(new Uint8Array(b),function(v){return ("0"+v.toString(16)).slice(-2)}).join("")}
 function go(){if(!(window.crypto&&crypto.subtle)){o.textContent="Tu navegador no permite calcular el hash aquí.";return}
  if(s.checked&&!salt){var r=new Uint8Array(4);crypto.getRandomValues(r);salt=hex(r.buffer)}if(!s.checked)salt="";

 x.oninput=go;s.onchange=function(){salt="";go()};go()}

  var no=100-p,dec=no/100,h=8760*dec,m=h*60;
  o.innerHTML='<div><span class="dh">Paso 1 · Horas de un año</span>365 días × 24 horas = <b>8,760 h</b><i>Es todo el tiempo que el servicio debería funcionar.</i></div>'+

function mig22(S){if(!S||S.v22>=2)return S||{};var M={"1": 2, "2": 7, "3": 9, "4": 10, "5": 12, "6": 13, "7": 14, "8": 15, "9": 17, "10": 18, "11": 19, "12": 20, "13": 21, "14": 23, "15": 24, "16": 25, "17": 26, "18": 27, "19": 28, "20": 29, "21": 31, "22": 32, "23": 33, "24": 34, "25": 35, "26": 36, "27": 38, "28": 39, "29": 40, "30": 41, "31": 42, "32": 43, "33": 44, "34": 45, "35": 46, "36": 47},N={};Object.keys(S).forEach(function(k){if(!/^\d+$/.test(k))N[k]=S[k]});Object.keys(S).forEach(function(k){if(/^\d+$/.test(k)){var n=M[k]!=null?M[k]:+k;N[n]=S[k]}});["att","bst"].forEach(function(f){if(S[f]&&typeof S[f]=="object"){var o={};Object.keys(S[f]).forEach(function(k){o[M[k]!=null?M[k]:k]=S[f][k]});N[f]=o}});delete N.pos;N.v22=2;return N}
var P=[
pL("🏥","¿Se puede confiar en la información?","De qué trata este R.A. y cómo usar este material",sp("En palabras sencillas","En el R.A. 2.1 viste cómo mantener la información <b>en secreto</b>. Ahora vas a aprender tres cosas nuevas:<br>1) cómo comprobar que <b>nadie cambió</b> la información (integridad),<br>2) cómo lograr que un servicio <b>siga funcionando</b> aunque algo falle (disponibilidad) y<br>3) cómo <b>defender</b> las computadoras, los servidores y la red.")+ex("Caso de las lecciones: Clínica dental Sonríe","Una clínica pequeña con expedientes de pacientes, una agenda de citas en internet y una caja para cobrar. Si alguien cambia la alergia de un paciente, es peligroso. Si la agenda no abre, pierden pacientes. Vamos a protegerla paso a paso.")+bk("Cómo estudiar con este material","<b>1.</b> Lee la lección con calma (un tema por pantalla).<br><b>2.</b> Cuando veas «Ejemplo resuelto», presiona <b>Siguiente paso</b> y lee el <b>¿por qué?</b> de cada paso.<br><b>3.</b> Haz la actividad. Si fallas, lee la explicación y la <b>pista</b>, y vuelve a intentarlo: equivocarse aquí no baja tu calificación.","")+bk("¿Se te olvidó algo de antes?","No pasa nada. Las siguientes pantallas son un <b>repaso</b> de lo que necesitas de los R.A. anteriores.","")+bk("Al final","Elaboras un <b>reporte</b> con la organización que te asigna la plataforma en la actividad de evaluación. Las 3 prácticas te dejan casi todo listo.",""),"Integridad = que no cambie · Disponibilidad = que funcione cuando se necesita · Defensa = varias capas de protección."),
pL("🔺","Repaso 1: los tres pilares de la seguridad","Lo viste en el R.A. 2.1 · Lo vas a usar en todo este R.A.",sp("En palabras sencillas","Proteger la información significa cuidar <b>tres cosas</b> al mismo tiempo. Se les llama los tres pilares (o la tríada CID).")+r3([["<div style='font-size:24px'>🤫</div>", "Confidencialidad", "Que solo la vea quien debe. Ejemplo: tus calificaciones solo las ves tú y tu profe."], ["<div style='font-size:24px'>✅</div>", "Integridad", "Que nadie la cambie sin permiso. Ejemplo: nadie puede subirse la calificación."], ["<div style='font-size:24px'>⏱️</div>", "Disponibilidad", "Que funcione cuando la necesitas. Ejemplo: la plataforma abre el día del examen."]])+bk("Truco para no confundirlos","Hazte tres preguntas: ¿la <b>vio</b> alguien que no debía? → confidencialidad. ¿La <b>cambiaron</b>? → integridad. ¿<b>No funciona</b> o no se puede usar? → disponibilidad.","")+ana("Piensa en tu celular","Si alguien lee tus chats: confidencialidad. Si alguien manda mensajes como si fueras tú: integridad. Si se te descarga la batería: disponibilidad."),"¿La vieron? → confidencialidad · ¿La cambiaron? → integridad · ¿No funciona? → disponibilidad."),
pA("🔺","¿Qué pilar se afecta?","Elige el pilar que se daña en cada situación de la clínica. Usa el truco de las tres preguntas.",[["Alguien cambia la alergia de un paciente en su expediente", "Integridad"], ["La agenda en línea no abre en todo el día", "Disponibilidad"], ["Un empleado publica radiografías de un paciente", "Confidencialidad"], ["Un virus modifica los montos de los cobros", "Integridad"], ["Se va la luz y el servidor no enciende", "Disponibilidad"]],"¿La vieron? → Confidencialidad · ¿La cambiaron? → Integridad · ¿No funciona? → Disponibilidad.",["Confidencialidad", "Integridad", "Disponibilidad"]),
pL("🖧","Repaso 2: equipos, servidores y redes","Lo viste en el R.A. 1.2 · Palabras que aparecen en los bloques B y C",bk("Host (equipo)","Cualquier aparato conectado a la red: una PC, una laptop, un celular, una impresora. «Host» solo es la palabra técnica para «equipo».","")+bk("Servidor","Una computadora que <b>da un servicio a muchos</b>: guarda la agenda de citas, la página web o los archivos de todos. Si el servidor se apaga, todos se quedan sin el servicio.","")+bk("Red","Los cables, el wifi, el módem y el router que <b>unen</b> a los equipos entre sí y con internet.","")+bk("Internet y proveedor","El proveedor (Telmex, Totalplay, Izzi…) es la empresa que te da la salida a internet. Si su servicio falla, toda la red se queda sin internet.","")+ana("Piensa en una escuela","Cada alumno es un <b>host</b>; la dirección que reparte avisos a todos es el <b>servidor</b>; los pasillos que conectan los salones son la <b>red</b>.")+ex("En la clínica","Hosts: la PC de recepción y la laptop del dentista. Servidor: la computadora donde vive la agenda. Red: el módem, el router y el wifi."),"Host = un equipo · Servidor = el equipo que atiende a todos · Red = lo que los conecta."),
pL("🔐","Repaso 3: cifrar y las claves","Lo viste en el R.A. 2.1 · Lo necesitas para el bloque A",sp("Cifrar","Convertir un mensaje en algo que no se entiende, usando una <b>clave</b>. Quien tiene la clave puede <b>regresarlo</b> a su forma original (descifrar). Cifrar sirve para guardar <b>secretos</b>.")+bk("Clave simétrica","Una sola clave para cerrar y abrir, como un candado con llave que copias para tu amigo.","")+bk("Clave pública y clave privada","Un par de claves que van juntas. La <b>pública</b> se le da a todo el mundo; la <b>privada</b> solo la tiene su dueño y nunca se comparte. Lo que hace una, solo lo comprueba o lo deshace la otra.","")+ana("Piensa en un buzón","Cualquiera puede meter cartas por la ranura (clave pública), pero solo el dueño tiene la llave para abrirlo (clave privada).")+bk("Lo nuevo de este R.A.","En la siguiente sección verás el <b>hash</b>. Se parece al cifrado, pero <b>no tiene regreso</b>: no se usa para guardar secretos, sino para descubrir si algo cambió.","wn"),"Cifrar = esconder y poder regresar · Clave pública = para todos · Clave privada = solo para su dueño."),
pL("➗","Repaso 4: porcentajes sin miedo","Matemáticas que vas a usar en el bloque B",sp("En palabras sencillas","«Por ciento» quiere decir «<b>de cada 100</b>». 25 % es 25 de cada 100. Para hacer cuentas, el porcentaje se pasa a decimal <b>dividiendo entre 100</b>.")+bk("Pasar a decimal","50 % → 50 ÷ 100 = <b>0.5</b> · 1 % → 1 ÷ 100 = <b>0.01</b> · 0.1 % → 0.1 ÷ 100 = <b>0.001</b>. Truco: dividir entre 100 es recorrer el punto decimal <b>dos lugares a la izquierda</b>.","")+px("Ejemplo resuelto: ¿cuánto es el 1 % de 8,760?",["<b>Escribe el porcentaje como decimal: 1 % = 0.01</b><span class=\"why\">🤔 <b>¿Por qué?</b> Las calculadoras y las cuentas no usan el signo %; por eso lo convertimos en número dividiendo entre 100.</span>", "<b>Multiplica la cantidad por el decimal: 8,760 × 0.01</b><span class=\"why\">🤔 <b>¿Por qué?</b> «El 1 % DE 8,760» se traduce como «0.01 POR 8,760». En matemáticas, «de» casi siempre significa multiplicar.</span>", "<b>Resultado: 87.6</b><span class=\"why\">🤔 <b>¿Por qué?</b> Revisa si tiene sentido: el 1 % es una parte muy pequeña, así que el resultado debe ser mucho menor que 8,760. ✔</span>"])+bk("¿Qué porcentaje es?","Si de 100 horas funcionó 96: 96 ÷ 100 = 0.96 → × 100 = <b>96 %</b>. Se divide la parte entre el total y se multiplica por 100.",""),"Porcentaje → decimal: ÷ 100 · «El X % de» = multiplicar por ese decimal."),
pT("➗","Practica los porcentajes","Escribe solo el número (usa punto decimal). Si fallas, abre la pista: te dice el primer paso.",[["Escribe 1 % como decimal", "0.01", "1 ÷ 100 = 0.01 (el punto se recorre dos lugares a la izquierda).", "Divide 1 entre 100.", "m", 0.0001], ["Escribe 0.1 % como decimal", "0.001", "0.1 ÷ 100 = 0.001.", "Divide 0.1 entre 100: recorre el punto dos lugares a la izquierda.", "m", 1e-05], ["Si algo funciona el 99 % del tiempo, ¿qué porcentaje NO funciona?", "1", "100 − 99 = 1 %. Lo que falta para llegar a 100 es lo que no funciona.", "Resta a 100 el porcentaje que sí funciona.", "m", 0.001], ["¿Cuánto es el 10 % de 200?", "20", "10 % = 0.1 → 200 × 0.1 = 20.", "Pasa 10 % a decimal y multiplica por 200.", "m", 0.01], ["¿Cuántas horas tiene un año? (365 días de 24 horas)", "8760", "365 × 24 = 8,760 horas. Este número lo vas a usar mucho.", "Multiplica los días por las horas de cada día.", "m", 0.5]],"Porcentaje a decimal: divide entre 100. «El X % de» algo: multiplica.","m"),
pL("🧬","Hash: la huella digital de los datos","Bloque A · Controles de integridad",sp("En palabras sencillas","Un <b>hash</b> es una fórmula matemática que convierte cualquier dato (una palabra, un archivo, una película) en un <b>código corto de tamaño fijo</b>. A ese código le decimos su <b>huella</b>. Con SHA-256 la huella siempre mide 64 caracteres.")+AN("hash")+bk("Regla 1 · Siempre igual","El mismo dato <b>siempre</b> da la misma huella. <i>Por eso podemos comparar.</i>","")+bk("Regla 2 · Cambia todo","Si cambia <b>una sola letra</b>, la huella cambia casi completa. <i>Por eso se nota cualquier cambio, por pequeño que sea.</i>","")+bk("Regla 3 · Sin regreso","Con la huella <b>no</b> se puede reconstruir el dato original. <i>Por eso es distinto de cifrar: el cifrado sí tiene regreso con la clave.</i>","")+ana("Piensa en tu huella dactilar","Te identifica, pero con tu huella nadie puede dibujar tu cara. O en un licuado: no puedes volver a sacar el plátano entero.")+bk("Algoritmos viejos","MD5 y SHA-1 ya no son seguros (se les encontraron fallas). Hoy se usa SHA-256 o superior.","wn"),"Mismo dato → misma huella · Una letra distinta → huella totalmente distinta · No tiene regreso."),
pL("🔎","Ejemplo resuelto: descubrir si alguien cambió un expediente","Bloque A · El hash en acción",sp("La situación","La clínica quiere saber si alguien modifica a escondidas el expediente de Ana. Mira cómo lo resuelve con un hash.")+px("Paso a paso",["<b>El lunes calculan la huella del expediente y la anotan en un lugar seguro.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Necesitamos una huella «original» para comparar después. Si no la guardamos, no hay contra qué comparar.</span>", "<b>El viernes vuelven a calcular la huella del mismo expediente.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Por la regla 1, si el expediente sigue igual, la huella tiene que salir exactamente igual.</span>", "<b>Comparan las dos huellas carácter por carácter (o solo las primeras 8 letras).</b><span class=\"why\">🤔 <b>¿Por qué?</b> Por la regla 2, si alguien cambió aunque sea una coma, la huella sería casi totalmente distinta; con ver el inicio basta para notarlo.</span>", "<b>Si son iguales: el expediente no cambió. Si son distintas: alguien lo modificó y hay que revisar.</b><span class=\"why\">🤔 <b>¿Por qué?</b> El hash no dice QUÉ cambió, solo SI cambió. Para saber qué cambió se revisan los respaldos y las bitácoras (las verás más adelante).</span>"])+bk("¿Dónde más se usa?","Al descargar programas: la página publica la huella del archivo; tú calculas la del archivo descargado y, si coinciden, sabes que nadie lo alteró en el camino.",""),"El hash responde «¿cambió o no cambió?». Para eso hay que guardar la huella original."),
pHash(),
pA("🧬","¿Qué pasa con la huella?","Usa lo que viste en el laboratorio de hash y las tres reglas.",[["Calculo el hash de «Hola» dos veces", "Sale la misma huella"], ["Cambio «Hola» por «hola»", "Sale una huella totalmente distinta"], ["Tengo solo la huella y quiero el texto original", "No se puede obtener"], ["Hago el hash de un archivo de 2 GB con SHA-256", "Sale una huella de 64 caracteres"]],"Repasa las 3 reglas: siempre igual · una letra cambia todo · sin regreso. Y la huella SHA-256 siempre mide 64.",["Sale la misma huella", "Sale una huella totalmente distinta", "No se puede obtener", "Sale una huella de 64 caracteres"]),
pL("🔑","¿Cómo se guardan las contraseñas?","Bloque A · Antes de ver la técnica salting",sp("El problema","Cuando creas una cuenta, la página tiene que guardar algo para reconocerte después. Si guardara tu contraseña <b>tal cual</b> y alguien robara la base de datos, tendría las contraseñas de todos.")+bk("La solución: guardar la huella","La página guarda el <b>hash</b> de tu contraseña, no la contraseña. Cuando inicias sesión, calcula el hash de lo que escribiste y lo compara con el guardado. <i>Si coinciden, escribiste bien. Y como el hash no tiene regreso, el ladrón no puede ver tu contraseña.</i>","")+ex("Por eso…","Una página seria <b>nunca</b> te puede enviar tu contraseña por correo si la olvidas: ella tampoco la conoce. Solo te deja crear una nueva.")+bk("Pero queda un hueco","Si dos personas usan «123456», sus hashes salen <b>iguales</b> (regla 1). Los atacantes tienen listas gigantes con los hashes de las contraseñas más comunes. Para tapar ese hueco existe la <b>sal</b>.","wn"),"Se guarda el hash de la contraseña, nunca la contraseña."),
pL("🧂","La técnica salting","Bloque A · Guardar contraseñas de forma segura",sp("En palabras sencillas","La <b>sal</b> es un valor al azar, <b>distinto para cada usuario</b>, que se pega a la contraseña <b>antes</b> de calcular el hash.")+AN("sal")+px("Ejemplo resuelto: dos personas con la misma contraseña",["<b>La recepcionista y el dentista eligen la contraseña «123456».</b><span class=\"why\">🤔 <b>¿Por qué?</b> Pasa en la vida real: mucha gente usa contraseñas iguales sin saberlo.</span>", "<b>El sistema le da a cada uno una sal distinta: «a7f2» a la recepcionista y «91bd» al dentista.</b><span class=\"why\">🤔 <b>¿Por qué?</b> La sal se genera al azar para que nunca se repita entre usuarios.</span>", "<b>Calcula el hash de «a7f2123456» y el de «91bd123456».</b><span class=\"why\">🤔 <b>¿Por qué?</b> Como lo que entra al hash ya es distinto, por la regla 2 las huellas salen totalmente distintas.</span>", "<b>Guarda la sal y el hash de cada uno. La contraseña se olvida.</b><span class=\"why\">🤔 <b>¿Por qué?</b> La sal no es secreta: se necesita para repetir el cálculo al iniciar sesión. Lo que nunca se guarda es la contraseña.</span>", "<b>Resultado: el atacante ve dos hashes diferentes y sus listas de hashes comunes ya no le sirven.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Esas listas se hicieron sin sal; con la sal, el atacante tendría que empezar de cero para cada usuario.</span>"])+ana("Piensa en…","Dos personas piden el mismo platillo, pero el cocinero le pone a cada uno un ingrediente secreto distinto: ya no saben igual.")+bk("En la vida real","Se usan algoritmos lentos a propósito, como <b>bcrypt</b> o <b>Argon2</b>, que ya incluyen la sal y hacen más difícil adivinar.",""),"Contraseña + sal → hash. Se guardan la sal y el hash; la contraseña no."),
pO("🧂","Ordena: guardar una contraseña","Pon en orden lo que hace el sistema cuando creas tu contraseña. Piensa: ¿qué se necesita primero para poder hacer lo siguiente?",[["El usuario escribe su contraseña nueva", "Sin contraseña no hay nada que proteger: todo empieza aquí."], ["El sistema genera una sal aleatoria para ese usuario", "La sal tiene que existir antes de calcular el hash, porque se pega a la contraseña."], ["Junta la sal con la contraseña y calcula el hash", "El hash se calcula sobre sal + contraseña."], ["Guarda la sal y el hash; la contraseña se descarta", "Solo se guarda lo necesario para comparar después. La contraseña nunca se guarda."], ["Al iniciar sesión repite el cálculo y compara los hashes", "Esto pasa después, cada vez que entras. Si los hashes coinciden, la contraseña es correcta."]],"Orden: escribir → generar sal → calcular hash → guardar → comparar al entrar."),
pL("🔏","HMAC: hash con clave secreta","Bloque A · Comprobar quién lo envió",sp("El problema","Un hash solo dice si algo cambió. Pero un tramposo podría cambiar el mensaje <b>y</b> calcular la huella nueva. ¿Cómo sabe la clínica que el mensaje sí viene del laboratorio?")+sp("La solución: HMAC","<b>HMAC</b> es un hash que se calcula usando también una <b>clave secreta</b> que solo conocen el emisor y el receptor. Sin la clave, nadie puede fabricar un HMAC correcto.")+AN("hmac")+px("Ejemplo resuelto: el laboratorio manda resultados",["<b>El laboratorio y la clínica acuerdan una clave secreta, en persona.</b><span class=\"why\">🤔 <b>¿Por qué?</b> La clave no debe viajar por internet; si alguien la roba, podría fabricar mensajes falsos.</span>", "<b>El laboratorio calcula el HMAC del resultado usando la clave y lo envía junto con el resultado.</b><span class=\"why\">🤔 <b>¿Por qué?</b> El HMAC funciona como un sello que solo puede hacer quien tiene la clave.</span>", "<b>La clínica recibe el mensaje y calcula el HMAC con su copia de la clave.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Si el mensaje no cambió y lo mandó el laboratorio, el HMAC calculado debe ser idéntico al recibido.</span>", "<b>Si coinciden, lo acepta. Si no, lo rechaza.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Un HMAC distinto significa que el mensaje fue alterado o que lo mandó alguien que no conoce la clave.</span>"])+ana("Piensa en…","Un sobre sellado con lacre y tu sello personal: si alguien lo abre, se nota, y solo tú tienes ese sello."),"Hash = ¿cambió? · HMAC = ¿cambió? + ¿lo mandó quien tiene la clave?"),
pL("✍️","Firmas digitales y certificados","Bloque A · Identidad en internet",sp("Firma digital","Se hace con la <b>clave privada</b> del que firma (solo él la tiene) y cualquiera la comprueba con su <b>clave pública</b>. Como solo el dueño tiene la privada, nadie más pudo firmar.")+bk("Qué asegura","<b>Integridad</b> (no cambió) + <b>autenticidad</b> (sí es de quien dice) + <b>no repudio</b> (el que firmó no puede decir «yo no fui»).","")+bk("Diferencia con HMAC","En HMAC los dos comparten la misma clave, así que cualquiera de los dos pudo hacerlo. En la firma digital solo el dueño tiene la clave privada: por eso hay no repudio.","")+sp("Certificado digital","Un documento que emite una <b>autoridad certificadora</b> (una empresa en la que todos confían) y que dice: «esta clave pública es de esta persona o de esta página». Es lo que hay detrás del <b>candado 🔒</b> de las páginas HTTPS.")+ana("Piensa en…","La firma es tu firma en papel; el certificado es tu INE: una autoridad confiable garantiza que esa firma es tuya.")+ex("En México","La <b>e.firma</b> del SAT es una firma digital con certificado, y las facturas electrónicas (CFDI) van firmadas digitalmente."),"Clave privada para firmar, clave pública para comprobar · El certificado dice de quién es la clave pública."),
pL("🗂️","¿Qué es una base de datos?","Bloque A · Antes de hablar de su integridad",sp("En palabras sencillas","Una <b>base de datos</b> es un conjunto de <b>tablas</b> donde un sistema guarda su información en orden. Se parece mucho a una hoja de Excel.")+bk("Tabla","Un tema: «Pacientes», «Citas», «Pagos».","")+bk("Registro (fila)","Un elemento de la tabla: un paciente, una cita.","")+bk("Campo (columna)","Un dato de cada registro: nombre, teléfono, fecha.","")+ex("En la clínica","Tabla Pacientes: <b>Expediente 101</b> · Ana López · 4421234567. Tabla Citas: Cita 55 · <b>Expediente 101</b> · 20-nov 10:00. El número de expediente une las dos tablas."),"Base de datos = tablas · Tabla = filas (registros) y columnas (campos)."),
pL("🗃️","Integridad en bases de datos","Bloque A · Reglas para que los datos guardados sean correctos",bk("Llave primaria","Un número que <b>no se puede repetir</b>, como el número de expediente. <i>¿Por qué? Para que nunca haya dos pacientes confundidos con el mismo número.</i>","")+bk("Llave foránea","Un campo que <b>apunta</b> a otra tabla, como el expediente dentro de cada cita. <i>¿Por qué? Para que no se pueda agendar una cita a un paciente que no existe.</i>","")+bk("Validaciones","Reglas como «el teléfono lleva 10 dígitos» o «la fecha de nacimiento no puede ser del futuro». <i>¿Por qué? Para que no entren datos imposibles por error.</i>","")+bk("Transacciones","<b>Todo o nada</b>: al cobrar se guarda el pago y se marca la cita como pagada; si una de las dos falla, no se guarda ninguna. <i>¿Por qué? Para que no quede un pago sin cita o una cita pagada sin pago.</i>","")+bk("Respaldos y bitácoras","El respaldo es una copia para regresar a como estaba; la bitácora es un registro de quién cambió qué y cuándo.",""),"Una base de datos también se protege con reglas, no solo con contraseñas."),
pA("🧰","¿Qué control de integridad usas?","Elige la herramienta para cada necesidad. Primero pregúntate: ¿es una contraseña, un mensaje, una firma, una página o un dato guardado?",[["Guardar las contraseñas de los empleados", "Hash con sal"], ["Que el laboratorio pruebe que el resultado no cambió y que lo envió él", "HMAC"], ["Que el dentista firme recetas electrónicas sin poder negarlo después", "Firma digital"], ["Que los pacientes comprueben que la página de citas es la verdadera", "Certificado digital"], ["Que no existan dos expedientes con el mismo número", "Llave primaria"]],"Contraseñas → hash con sal · Mensaje con clave compartida → HMAC · Firmar sin negarlo → firma digital · Identidad de una página → certificado · Número que no se repite → llave primaria.",["Hash con sal", "HMAC", "Firma digital", "Certificado digital", "Llave primaria"]),
pZ("🗃️","Completa las reglas de la base de datos","Elige la palabra correcta para cada regla de la clínica. Si dudas, regresa a la lección anterior.","<p>El número de expediente es la {0}: no se repite.</p><p>La tabla Citas usa una {1} para que cada cita pertenezca a un paciente que sí existe.</p><p>Al cobrar, el pago y el estado de la cita se guardan en una {2}: se hace todo o nada.</p><p>La regla «el teléfono lleva 10 dígitos» es una {3}.</p><p>Las contraseñas se guardan como {4}.</p>",[["llave primaria", ["llave primaria", "llave foránea", "contraseña"]], ["llave foránea", ["llave foránea", "llave primaria", "sal"]], ["transacción", ["transacción", "firma", "bitácora"]], ["validación", ["validación", "transacción", "llave foránea"]], ["hash con sal", ["hash con sal", "texto claro", "llave primaria"]]],"No se repite → llave primaria · Apunta a otra tabla → llave foránea · Todo o nada → transacción · Regla de formato → validación."),
pL("🛞","Disponibilidad y alta disponibilidad","Bloque B · Que el servicio no se detenga",sp("En palabras sencillas","<b>Disponibilidad</b> es que el servicio funcione cuando se necesita. <b>Alta disponibilidad</b> es prepararlo para que <b>siga funcionando aunque algo se descomponga</b>.")+AN("raid")+bk("Punto único de falla","Una pieza que, si falla, <b>detiene todo</b> porque no tiene repuesto: un solo disco, un solo servidor, un solo proveedor de internet. <i>Para encontrarlo pregúntate: «si esto se descompone, ¿se cae el servicio?». Si la respuesta es sí y solo hay uno, es un punto único de falla.</i>","")+bk("Redundancia = tener repuesto","Poner dos (o más) de lo importante, para que si uno falla el otro siga.","")+r3([["<div style='font-size:24px'>💽</div>", "RAID 1", "Dos discos con la misma información (espejo). Si uno muere, el otro sigue."], ["<div style='font-size:24px'>🔋</div>", "UPS (no-break)", "Una batería que da luz unos minutos cuando se va la electricidad."], ["<div style='font-size:24px'>🌐</div>", "Dos proveedores", "Si se cae el internet de uno, se usa el del otro."]])+bk("Para servicios grandes","<b>Clúster</b>: varios servidores que trabajan como uno; si uno falla, otro toma su lugar. <b>Balanceo de carga</b>: reparte las visitas entre varios servidores para que ninguno se sature.","")+ana("Piensa en…","La llanta de refacción del coche: no evita que se ponche, pero te deja seguir."),"Encuentra lo que es único y, si falla, detiene todo; luego ponle repuesto."),
pL("9️⃣","Los «nueves» de la disponibilidad","Bloque B · Cómo se mide",sp("En palabras sencillas","La disponibilidad se mide en <b>porcentaje del tiempo que el servicio funciona</b>. Las empresas prometen «tres nueves» (99.9 %), «cuatro nueves» (99.99 %), etc. Lo que importa es cuánto tiempo puede estar <b>caído</b>.")+px("Ejemplo resuelto: ¿cuántas horas al año puede fallar un servicio de 99.9 %?",["<b>Paso 1 · Calcula las horas de un año: 365 × 24 = 8,760 h.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Es el tiempo total que el servicio debería funcionar. Siempre se parte de aquí.</span>", "<b>Paso 2 · Calcula la parte que NO funciona: 100 − 99.9 = 0.1 %.</b><span class=\"why\">🤔 <b>¿Por qué?</b> El 99.9 % es lo que SÍ funciona; nos preguntan por lo que falla, que es lo que falta para llegar a 100.</span>", "<b>Paso 3 · Pasa ese porcentaje a decimal: 0.1 ÷ 100 = 0.001.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Para hacer la cuenta, el porcentaje se convierte a decimal dividiendo entre 100 (Repaso 4).</span>", "<b>Paso 4 · Multiplica: 8,760 × 0.001 = 8.76 horas al año.</b><span class=\"why\">🤔 <b>¿Por qué?</b> «El 0.1 % de 8,760» significa multiplicar. Ese es el tiempo máximo caído.</span>", "<b>Extra · Si te lo piden en minutos: 8.76 × 60 = 525.6 minutos.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Cada hora tiene 60 minutos, por eso se multiplica por 60. Si te lo piden en días, divide las horas entre 24.</span>"])+bk("La tabla ya calculada","99 % → 87.6 h (unos 3.65 días) · 99.9 % → 8.76 h · 99.99 % → 52.6 min · 99.999 % → unos 5 min al año.","")+bk("Error común","Multiplicar 8,760 × 99.9. ¡Eso da el tiempo que SÍ funciona (y además sin pasar a decimal)! Primero resta a 100 y luego divide entre 100.","wn"),"Horas del año (8,760) × (100 − disponibilidad) ÷ 100 = horas caídas."),

pT("🧮","Calcula el tiempo fuera de servicio","Escribe solo el número. Haz los 4 pasos en tu cuaderno; puedes revisar con la calculadora de disponibilidad.",[["Un servicio tiene 99 % de disponibilidad. ¿Cuántas horas puede estar caído al año?", "87.6", "Paso 2: 100 − 99 = 1 %. Paso 3: 1 ÷ 100 = 0.01. Paso 4: 8,760 × 0.01 = 87.6 horas.", "Lo que no funciona es 1 %. ¿Cuánto es el 1 % de 8,760?", "m", 0.05], ["Con 99.9 %, ¿cuántas horas al año?", "8.76", "100 − 99.9 = 0.1 % → 0.001 → 8,760 × 0.001 = 8.76 horas.", "Lo que no funciona es 0.1 %, que en decimal es 0.001.", "m", 0.01], ["La agenda estuvo caída 4 horas de las 100 que debía funcionar esta semana. ¿Qué porcentaje estuvo disponible?", "96", "Funcionó 100 − 4 = 96 horas. 96 ÷ 100 = 0.96 → × 100 = 96 %.", "Primero resta las horas caídas a las 100; luego divide entre el total y multiplica por 100.", "m", 0.05], ["Con 99.99 %, ¿cuántos minutos al año? (redondea a un decimal)", "52.6", "100 − 99.99 = 0.01 % → 0.0001 → 8,760 × 0.0001 = 0.876 h → 0.876 × 60 = 52.56 ≈ 52.6 minutos.", "Saca primero las horas igual que antes y al final multiplica por 60.", "m", 0.1]],"Los 4 pasos: 8,760 h → 100 − % → ÷ 100 → multiplica. Para minutos, × 60.","m"),
pL("🏰","Defensa en profundidad","Bloque B · Varias capas de protección",sp("En palabras sencillas","Poner <b>varias capas de protección</b>, una detrás de otra, para que si una falla las demás sigan protegiendo. <i>¿Por qué? Porque ninguna protección es perfecta: el antivirus no detecta todo y la gente se equivoca.</i>")+bk("Las capas (de afuera hacia adentro)","Reglas y capacitación → seguridad física → red → equipo (host) → aplicación → datos.","")+AN("capas")+ana("Piensa en un castillo","Foso, muralla, guardias, puerta y caja fuerte. Un ladrón tendría que vencerlas todas.")+ex("En la clínica","Un empleado abre un correo falso (falla la capacitación) → el antivirus lo bloquea (capa host) → y si no lo bloquea, los expedientes están cifrados y respaldados (capa datos)."),"Nunca confíes en una sola protección."),
pL("🚨","Respuesta a incidentes","Bloque B · Qué hacer cuando algo pasa",sp("En palabras sencillas","Un <b>incidente</b> es algo que daña la seguridad: un virus, un robo de datos, un servidor caído. Para no improvisar, la respuesta sigue <b>4 fases en orden</b>.")+bk("Dos palabras que vas a ver","<b>Malware</b>: cualquier programa dañino (virus, gusano, troyano…). <b>Ransomware</b>: un malware que <b>cifra tus archivos</b> para que no puedas abrirlos y te <b>pide dinero (rescate)</b> para devolverlos. <i>Por eso los respaldos son tan importantes: con ellos no necesitas pagar.</i>","")+AN("inc")+bk("1. Preparación (antes)","Tener un plan, saber quién hace qué, tener respaldos. <i>¿Por qué va primero? Porque en plena emergencia ya no da tiempo de hacer respaldos ni planes.</i>","")+bk("2. Detección y análisis","Darse cuenta de que algo pasa y entender qué fue y qué tan grave es. <i>¿Por qué antes de actuar? Porque no puedes arreglar algo que no entiendes.</i>","")+bk("3. Contención, erradicación y recuperación","Aislar el problema para que no se extienda, eliminar la causa y volver a funcionar. <i>¿Por qué en ese orden? Primero se detiene el daño (como cerrar la llave de agua en una fuga) y luego se repara.</i>","")+bk("4. Lecciones aprendidas (después)","Revisar qué falló y mejorar. <i>¿Por qué? Para que no vuelva a pasar lo mismo.</i>","")+ana("Piensa en un simulacro de sismo","Te preparas antes, actúas con orden durante y revisas qué mejorar después."),"Preparar → detectar → contener y recuperar → aprender."),
pL("🌪️","Recuperación tras un desastre: RPO y RTO","Bloque B · Volver a funcionar",sp("En palabras sencillas","Después de un desastre (incendio, inundación, un virus que cifra todo), hay dos preguntas. Cada una tiene su nombre:")+AN("rpo")+bk("RPO · ¿Cuánta información puedo perder?","Mira <b>hacia atrás</b>: todo lo que se hizo desde el último respaldo se pierde. Por eso el RPO depende de <b>cada cuánto respaldas</b>.","")+bk("RTO · ¿En cuánto tiempo debo volver a funcionar?","Mira <b>hacia adelante</b>: es el tiempo máximo que el servicio puede estar caído antes de que sea un problema grave.","")+px("Ejemplo resuelto: la clínica respalda todas las noches",["<b>La clínica respalda cada noche a las 23:00.</b><span class=\"why\">🤔 <b>¿Por qué?</b> El respaldo es el «punto de guardado» al que podemos regresar.</span>", "<b>El jueves a las 18:00 un virus cifra todo.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Lo último que quedó guardado es el respaldo del miércoles a las 23:00.</span>", "<b>Se pierde lo del jueves de 0:00 a 18:00 (más el rato del miércoles después de las 23:00): unas 19 horas.</b><span class=\"why\">🤔 <b>¿Por qué?</b> Todo lo que se capturó después del último respaldo no está en ninguna copia.</span>", "<b>En el peor caso (falla justo antes del respaldo) se pierde casi un día: RPO = 24 horas.</b><span class=\"why\">🤔 <b>¿Por qué?</b> El RPO es igual al tiempo entre respaldos: si respaldas cada 24 h, puedes perder hasta 24 h.</span>", "<b>La dueña dice: «la agenda tiene que volver en máximo 2 horas». Entonces RTO = 2 horas.</b><span class=\"why\">🤔 <b>¿Por qué?</b> El RTO no se calcula: lo decide la organización según cuánto aguanta sin el servicio.</span>"])+bk("Regla 3-2-1 de respaldos","<b>3</b> copias, en <b>2</b> tipos de soporte distintos (disco y nube, por ejemplo) y <b>1</b> fuera del lugar. <i>¿Por qué fuera? Porque un incendio quemaría también las copias que estén en el mismo edificio.</i>","")+ana("Piensa en un videojuego","El RPO es cada cuánto guardas la partida (lo que pierdes si se apaga); el RTO es cuánto tardas en volver a jugar."),"RPO = datos perdidos (hacia atrás, depende del respaldo) · RTO = tiempo para volver (hacia adelante)."),
pO("🚨","Ordena la respuesta a un ransomware","La clínica descubre que sus archivos están cifrados por un virus que pide rescate. Ordena lo que deben hacer, de lo primero a lo último.",[["Tener respaldos y un plan antes de que pase", "Preparación: va primero porque sin respaldos no hay de dónde recuperar."], ["Detectar los archivos cifrados y analizar qué equipos están afectados", "Detección y análisis: entender qué pasó antes de actuar."], ["Desconectar de la red los equipos infectados", "Contención: se aísla para que el virus no pase a más equipos."], ["Eliminar el malware y restaurar los respaldos", "Erradicación y recuperación: ya contenido, se limpia y se vuelve a funcionar."], ["Revisar cómo entró y capacitar al personal", "Lecciones aprendidas: al final, para que no se repita."]],"Antes (preparar) → darse cuenta → detener el daño → limpiar y recuperar → aprender."),
pA("⏱️","¿RPO o RTO?","Decide de qué meta habla cada frase. Pregúntate: ¿habla de DATOS perdidos o de TIEMPO sin servicio?",[["Respaldamos cada 4 horas, así que perderíamos máximo 4 horas de datos", "RPO"], ["La agenda debe volver a funcionar en menos de 1 hora", "RTO"], ["No podemos perder más de un día de cobros", "RPO"], ["El sistema de cobro puede estar caído máximo medio día", "RTO"]],"¿Datos perdidos? → RPO · ¿Tiempo sin servicio? → RTO.",["RPO", "RTO"]),
pA("🛞","¿Qué mecanismo usarías?","Elige la solución de alta disponibilidad para cada riesgo. Piensa: ¿qué pieza falla y cuál sería su repuesto?",[["Que falle un disco del servidor", "RAID (discos en espejo)"], ["Que se vaya la luz", "UPS (no-break) o planta de luz"], ["Que se caiga el internet", "Segundo proveedor de internet"], ["Que un solo servidor no aguante tantas visitas", "Balanceo de carga"], ["Que se incendie la clínica", "Respaldo fuera del lugar (nube)"]],"Disco → RAID · Luz → UPS · Internet → segundo proveedor · Muchas visitas → balanceo · Incendio → copia fuera."),
pL("🧭","¿Host, servidor, red o física? Cómo distinguirlos","Bloque C · Antes de empezar",sp("En palabras sencillas","En este bloque vas a clasificar medidas de protección en <b>4 capas</b>. Para no confundirte, fíjate <b>qué cosa protege</b> la medida.")+bk("💻 Host","¿Protege a <b>un solo equipo</b> que usa una persona? (su PC, su laptop, su celular).","")+bk("🗄️ Servidor","¿Protege a la computadora que <b>atiende a todos</b>? (la de la agenda, la de los archivos).","")+bk("🌐 Red","¿Protege <b>la conexión</b> entre equipos o con internet? (wifi, firewall, router).","")+bk("🔐 Física","¿Es algo que se puede <b>tocar</b>: puertas, llaves, cámaras, energía, discos?","")+bk("Caso con truco","Un no-break se conecta al servidor, pero protege la <b>energía</b>, que es algo físico: va en «física». Fíjate en <b>qué protege</b>, no en dónde se conecta.","wn"),"Un equipo → host · El que atiende a todos → servidor · La conexión → red · Lo que se toca → física."),
pL("💻","Protección del host","Bloque C · Cada computadora",sp("En palabras sencillas","Un <b>host</b> es cualquier equipo que usa una persona. Cada uno debe poder protegerse solo.")+bk("Actualizaciones al día","A las actualizaciones de seguridad también se les llama <b>parches</b>. <i>¿Por qué?</i> Tapan fallas que los atacantes ya conocen. <i>Regla práctica: si el último parche tiene más de 3 meses, el equipo está atrasado.</i>","")+bk("Antivirus activo","<i>¿Por qué?</i> Detecta y bloquea programas dañinos antes de que actúen.","")+bk("Firewall del equipo","<i>¿Por qué?</i> Bloquea conexiones que nadie pidió.","")+bk("Cuenta estándar (sin permisos de administrador) para trabajar","<i>¿Por qué?</i> Si entra un virus, no tiene permiso de instalar ni de cambiar todo el equipo.","")+bk("Bloqueo de pantalla y disco cifrado (BitLocker)","<i>¿Por qué?</i> Si te alejas o te roban la laptop, nadie puede ver tus archivos.","")+ex("En la clínica","La PC de recepción usa cuenta estándar, se bloquea sola a los 5 minutos y tiene el disco cifrado."),"Cada equipo: actualizado, con antivirus, firewall, cuenta estándar, bloqueo y disco cifrado."),
pL("🗄️","Protección del servidor","Bloque C · El equipo que da servicio a todos",bk("Menos es más","Apagar los servicios y cerrar los puertos que no se usan. <i>¿Por qué? Cada servicio encendido es una puerta por la que podrían entrar.</i>","")+bk("Escritorio remoto: solo por VPN","El <b>escritorio remoto</b> permite manejar el servidor desde otra computadora, como si estuvieras sentado frente a él. Es útil, pero <b>no se deja abierto a todo internet</b>: se entra primero por una <b>VPN</b> (la verás en «Protección de la red»). <i>¿Por qué? Si queda abierto, cualquier persona del mundo puede intentar adivinar la contraseña.</i>","")+bk("Mínimo privilegio","Solo quien lo necesita tiene cuenta de administrador, con contraseña fuerte y doble factor. <i>¿Por qué? Menos llaves maestras = menos riesgo de que una se pierda.</i>","")+bk("Bitácoras y monitoreo","Registrar quién entra y qué cambia, y revisarlo. <i>¿Por qué? Así se detecta a tiempo algo raro.</i>","")+bk("Respaldos y parches","Respaldar diario y aplicar actualizaciones en un horario planeado. <i>¿Por qué planeado? Para no apagar el servicio cuando más se usa.</i>","")+ana("Piensa en…","La bodega de una tienda: pocas puertas, pocas llaves, cámara y registro de quién entra."),"Un servidor seguro tiene pocas puertas abiertas y alguien vigilándolas."),
pL("🌐","Protección de la red","Bloque C · Lo que une a todos",bk("Firewall","Un «portero» que revisa lo que entra y sale de internet y bloquea lo que no está permitido.","")+bk("Segmentación (VLAN)","Dividir la red en partes separadas: el wifi de pacientes en una, las computadoras de la clínica en otra. <i>¿Por qué? Si un paciente trae un celular infectado, no llega a los expedientes.</i>","")+bk("IDS / IPS","Vigilantes de la red: el IDS <b>avisa</b> si ve tráfico sospechoso; el IPS además lo <b>bloquea</b>.","")+bk("VPN","Un «túnel» cifrado para conectarse a la red de la clínica desde fuera, sin que nadie vea lo que pasa por él.","")+bk("Wifi seguro","Usar <b>WPA2</b> o <b>WPA3</b> con contraseña fuerte. <i>¿Por qué? Una red abierta deja entrar a cualquiera que esté cerca.</i>",""),"Separar la red evita que un problema en un lado llegue a todo."),
pL("🔐","Seguridad física","Bloque C · Lo que se puede tocar",bk("Control de acceso","El cuarto del servidor con llave o tarjeta; solo entra personal autorizado.","")+bk("Vigilancia","Cámaras y libreta o registro de visitas.","")+bk("Energía y ambiente","No-break, regulador, ventilación y extintor para equipo eléctrico.","")+bk("Equipos y medios","Candados para laptops; destruir los discos viejos antes de tirarlos (borrar no basta: los archivos se pueden recuperar).","")+bk("Recuerda","De nada sirve el mejor firewall si alguien puede entrar y llevarse el servidor.","wn"),"La seguridad empieza por la puerta."),
pA("🧱","¿Qué capa protege?","Clasifica cada medida. Usa el truco: ¿protege a un equipo, al que atiende a todos, la conexión o algo que se toca?",[["Cifrar el disco de la laptop del dentista", "Host"], ["Desactivar en el servidor los servicios que no se usan", "Servidor"], ["Separar el wifi de pacientes de la red interna", "Red"], ["Poner llave al cuarto del servidor", "Física"], ["Instalar un IDS que avise de tráfico raro", "Red"], ["Usar cuenta estándar en la PC de recepción", "Host"], ["Instalar un no-break para el servidor", "Física"]],"Un equipo → Host · El que atiende a todos → Servidor · La conexión → Red · Lo que se toca o la energía → Física.",["Host", "Servidor", "Red", "Física"]),
pA("⚖️","¿Buena o mala práctica?","Decide si cada práctica de la clínica es buena o mala. Pregúntate: ¿abre una puerta o la cierra?",[["Dejar abierto el escritorio remoto del servidor a todo internet", "Mala práctica"], ["Usar WPA3 con contraseña fuerte en la red interna", "Buena práctica"], ["Que todos usen la cuenta de administrador para ir más rápido", "Mala práctica"], ["Tirar a la basura un disco viejo con expedientes sin borrarlo", "Mala práctica"], ["Revisar cada semana las bitácoras del servidor", "Buena práctica"]],"¿Abre una puerta? → mala práctica · ¿La cierra? → buena práctica.",["Buena práctica", "Mala práctica"]),
pL("📝","Ejemplo resuelto: cómo escribir una medida por capa","Bloque C · Antes de redactar",sp("La fórmula","Para cada capa escribe una oración así: <b>Capa: qué medida pones + para qué sirve</b>. El «para qué» demuestra que entiendes, no solo que memorizaste.")+px("Paso a paso con la clínica",["<b>Host: «Las PCs de recepción tienen antivirus y disco cifrado para que, si las roban, no se vean los expedientes».</b><span class=\"why\">🤔 <b>¿Por qué?</b> Nombra el equipo, la medida y el para qué.</span>", "<b>Servidor: «En el servidor de la agenda solo dejamos encendido el servicio de citas, para tener menos puertas abiertas».</b><span class=\"why\">🤔 <b>¿Por qué?</b> Usa la palabra «servidor» y explica el beneficio.</span>", "<b>Red: «Separamos el wifi de pacientes de la red interna con una VLAN, para que un celular infectado no llegue a los expedientes».</b><span class=\"why\">🤔 <b>¿Por qué?</b> Menciona algo de la red (wifi, firewall, VLAN, VPN).</span>", "<b>Física: «El cuarto del servidor tiene llave y un no-break, para que nadie se lo lleve y no se apague si se va la luz».</b><span class=\"why\">🤔 <b>¿Por qué?</b> Menciona algo que se pueda tocar.</span>"])+bk("No copies el ejemplo","En la siguiente actividad usa tus propias medidas (puedes elegir otras de las lecciones). Se revisa que menciones las 4 capas.","wn"),"Capa + medida + para qué sirve."),
pW("✍️","Defiende la clínica en 4 capas","Aplica la fórmula de la lección anterior: capa + medida + para qué sirve.","Escribe una medida para cada capa de la clínica: <b>host</b>, <b>servidor</b>, <b>red</b> y <b>física</b>. Una oración por capa.",[["Tiene al menos 25 palabras", "palabras:25"], ["Una medida para el host (equipo, PC, laptop, antivirus, cifrado…)", "\\b(host|pc|computadora\\w*|laptop\\w*|equipos?|antivirus|bitlocker|cifr\\w+)\\b"], ["Una medida para el servidor", "\\bservidor\\w*\\b"], ["Una medida para la red (firewall, VLAN, wifi, IDS, VPN…)", "\\b(red|redes|firewall|vlan|wifi|ids|ips|vpn|wpa\\w*)\\b"], ["Una medida física (llave, cámara, no-break, acceso…)", "\\b(llave\\w*|camara\\w*|no-?break|ups|acceso fisico|cuarto\\w*|candado\\w*|tarjeta\\w*|fisic\\w+)\\b"]],"Empieza cada oración con el nombre de la capa: «Host: …», «Servidor: …», «Red: …», «Física: …».","Host: las PCs tienen … para que … Servidor: … Red: … Física: …"),
pL("🐞","Vulnerabilidades: CVE y CVSS","Bloque D · Dominio de vulnerabilidades",sp("En palabras sencillas","Una <b>vulnerabilidad</b> es una falla de un programa o equipo que un atacante puede aprovechar (lo viste en el R.A. 2.1). Cuando una falla se hace pública, recibe un número de identificación llamado <b>CVE</b>, por ejemplo CVE-2024-11477.")+bk("Cómo se lee un CVE","<b>CVE</b> - <b>2024</b> (año en que se registró) - <b>11477</b> (número consecutivo). Es como la matrícula de la falla.","")+bk("CVSS · qué tan grave es","Una calificación de 0 a 10: <b>Baja</b> 0.1–3.9 · <b>Media</b> 4.0–6.9 · <b>Alta</b> 7.0–8.9 · <b>Crítica</b> 9.0–10. Entre más alto, más urgente arreglarla.","")+bk("Dónde se consultan","<b>nvd.nist.gov</b> (base de datos del gobierno de EUA, en inglés) y <b>cve.org</b>.","")+ana("Piensa en…","Los «llamados a revisión» de los coches: el fabricante publica la falla, su número y qué tan peligrosa es, para que la arregles.")+bk("¿En cuánto tiempo se corrige?","Una guía sencilla que usan muchas empresas: <b>Crítica</b> → hoy mismo (máximo 2 días) · <b>Alta</b> → esta semana · <b>Media</b> → este mes · <b>Baja</b> → en el siguiente mantenimiento programado. <i>¿Por qué? Entre más grave, más fácil y dañino es que la aprovechen.</i>","")+bk("¿Cómo se corrige?","Casi siempre <b>actualizando</b> el programa. En la descripción de la falla (en inglés) busca «<b>before</b> 24.07» o «<b>prior to</b> 24.07»: significa que la falla está en las versiones <b>anteriores</b> a la 24.07, así que la solución es actualizar a esa versión o a una más nueva.","")+ex("En la clínica","El sistema de citas tiene una CVE con CVSS 9.8: es crítica y se actualiza hoy mismo. Una de 3.1 (baja) se programa para el siguiente mantenimiento."),"CVE = el nombre de la falla · CVSS = qué tan grave es · Primero se corrigen las críticas y altas."),
pA("🐞","Clasifica la gravedad","Según su calificación CVSS, ¿qué tan grave es cada vulnerabilidad? Busca en qué rango cae el número.",[["CVE con CVSS 9.8", "Crítica"], ["CVE con CVSS 5.3", "Media"], ["CVE con CVSS 7.5", "Alta"], ["CVE con CVSS 2.1", "Baja"], ["CVE con CVSS 10.0", "Crítica"]],"Menos de 4 → Baja · de 4 a 6.9 → Media · de 7 a 8.9 → Alta · 9 o más → Crítica.",["Baja", "Media", "Alta", "Crítica"]),
pL("🧭","Ética y principios rectores","Bloque D · Saber mucho exige responsabilidad",sp("En palabras sencillas","Lo que aprendes de ciberseguridad sirve para proteger o para dañar. La <b>ética</b> es lo que marca la diferencia entre un especialista y un delincuente.")+bk("1. Permiso por escrito","Solo se revisa un sistema con autorización firmada de su dueño. <i>¿Por qué? Sin permiso es un delito: el Código Penal Federal castiga el acceso ilícito a sistemas (artículos 211 bis 1 al 211 bis 7).</i>","")+bk("2. Cuidar la privacidad","Los datos personales que veas mientras trabajas no se comentan ni se publican.","")+bk("3. No causar daño","Probar sin apagar servicios ni borrar información.","")+bk("4. Avisar de forma responsable","Si encuentras una falla, se la reportas al dueño y le das tiempo de corregirla antes de contarla.","")+ex("Hacker ético y prueba de penetración","Una empresa contrata a una especialista para atacar su propia red y encontrar fallas antes que los delincuentes. A ese ataque autorizado se le llama <b>prueba de penetración</b> (o «pentest»). Antes firma un contrato que dice qué puede y qué no puede hacer."),"Mismo conocimiento, distinta intención: el permiso lo cambia todo."),
pA("🧭","¿Es ético?","Decide si cada acción es ética o no. Usa las 3 preguntas: ¿tengo permiso?, ¿cuido la privacidad?, ¿causo daño?",[["Escanear la red de la escuela por curiosidad, sin pedir permiso", "No es ético"], ["Reportar al dueño una falla que encontraste en su página", "Es ético"], ["Publicar en redes los datos de pacientes que viste en una auditoría", "No es ético"], ["Hacer una prueba de penetración con contrato firmado", "Es ético"], ["Usar la contraseña de un compañero que dejó su sesión abierta", "No es ético"]],"¿Tengo permiso? ¿Cuido la privacidad? ¿Causo daño? Si alguna falla → no es ético.",["Es ético", "No es ético"]),
pL("🛠️","Herramientas de ciberseguridad","Bloque D · Lo que usa un profesional",sp("Para recordar","Asocia cada herramienta con <b>una sola palabra</b>: la que dice qué revisa.")+bk("Nmap → puertos","Descubre qué equipos hay en una red y qué «puertas» (puertos) tienen abiertas.","")+bk("Wireshark → tráfico","Captura y muestra lo que viaja por la red.","")+bk("Escáner de vulnerabilidades → fallas","Como OpenVAS: revisa los equipos buscando fallas conocidas (CVE).","")+bk("Gestor de contraseñas → contraseñas","Como Bitwarden: guarda contraseñas largas y distintas, cifradas.","")+bk("VirusTotal → archivos y enlaces","Revisa un archivo o un enlace con muchos antivirus a la vez.","")+bk("Recuerda","Usar Nmap o Wireshark en una red ajena sin permiso es un delito.","wn"),"Puertos → Nmap · Tráfico → Wireshark · Fallas → escáner · Contraseñas → gestor · Archivo sospechoso → VirusTotal."),
pA("🛠️","¿Qué herramienta usas?","Elige la herramienta para cada tarea autorizada. Busca la palabra clave: puertos, tráfico, archivo, fallas o contraseñas.",[["Saber qué puertos tiene abiertos el servidor de la clínica", "Nmap"], ["Ver qué tráfico sale de la PC de recepción", "Wireshark"], ["Revisar un archivo adjunto sospechoso", "VirusTotal"], ["Buscar fallas conocidas (CVE) en todos los equipos", "Escáner de vulnerabilidades"], ["Guardar contraseñas distintas para cada sistema", "Gestor de contraseñas"]],"Puertos → Nmap · Tráfico → Wireshark · Archivo → VirusTotal · Fallas → escáner · Contraseñas → gestor."),
pL("📖","Glosario (1 de 2)","Apoyo · Palabras que vas a usar",bk("Integridad","Que la información no se cambie sin permiso.","")+bk("Hash","Fórmula que convierte un dato en una huella de tamaño fijo y sin regreso.","")+bk("SHA-256","Algoritmo de hash seguro; su huella mide 64 caracteres.","")+bk("Sal (salting)","Valor al azar que se pega a la contraseña antes de calcular el hash.","")+bk("HMAC","Hash que se calcula con una clave secreta compartida.","")+bk("Firma digital","Se hace con la clave privada y se comprueba con la pública.","")+bk("Certificado","Documento de una autoridad que dice de quién es una clave pública (el candado HTTPS).","")+bk("No repudio","Que quien firmó no pueda negar que lo hizo.","")+bk("Llave primaria","Número que identifica un registro y no se repite.","")+bk("Llave foránea","Campo que apunta a un registro de otra tabla.","")+bk("Transacción","Operación de «todo o nada» en una base de datos.","")),
pL("📖","Glosario (2 de 2)","Apoyo · Palabras que vas a usar",bk("Disponibilidad","Que el servicio funcione cuando se necesita.","")+bk("Alta disponibilidad","Preparar el servicio para que siga aunque algo falle.","")+bk("Punto único de falla","Pieza sin repuesto que, si falla, detiene todo.","")+bk("Redundancia","Tener repuesto de lo importante.","")+bk("RAID 1","Dos discos con la misma información (espejo).","")+bk("UPS (no-break)","Batería que da electricidad cuando se va la luz.","")+bk("Defensa en profundidad","Varias capas de protección, una detrás de otra.","")+bk("RPO","Cuánta información se puede perder (depende de cada cuánto respaldas).","")+bk("RTO","En cuánto tiempo debe volver el servicio.","")+bk("CVE","Número de identificación de una vulnerabilidad pública.","")+bk("CVSS","Calificación de gravedad de 0 a 10.","")+bk("Ransomware","Malware que cifra tus archivos y pide un rescate para devolverlos.","")+bk("Parche","Actualización que tapa una falla de seguridad.","")+bk("VLAN","Red separada dentro de la misma red física.","")),
pL("👩‍🏫","Guía para el docente","Sesiones sugeridas con tu cronograma y tus horas de laboratorio",bk("Antes de empezar","Laboratorio del grupo 511: <b>lunes 17:20-18:10</b> y <b>viernes 18:10-19:50</b>. Cada práctica tiene versión para celular.","sp")+bk("Versión «anti dudas»","Empieza aquí incluye 4 repasos (pilares, equipos y redes, cifrado y claves, porcentajes) para quien aún batalla con R.A. anteriores. Los temas difíciles tienen ejemplo resuelto con el porqué de cada paso, todas las actividades tienen pista y las prácticas explican qué hacer, por qué y qué hacer si algo no sale. En Diagnostica hay una calculadora de disponibilidad que muestra los 4 pasos.","sp")+bk("Bloque A · 23 y 26-oct","Viernes 23: repasos, hash, laboratorio de hash, contraseñas y salting en clase. <b>Lunes 26 (primera hora, laboratorio): Práctica 1</b> (la versión de celular usa la sal, por eso salting va antes); después HMAC, firmas e integridad en bases de datos.","")+bk("Bloque B · 26-oct y 2-nov","Lunes 26 (últimas horas): disponibilidad y los nueves (resolver juntos el ejemplo en el pizarrón). Viernes 30 es CTEC. Lunes 2-nov: defensa en profundidad, incidentes y RPO/RTO; <b>Práctica 2</b> como tarea o en celular.","")+bk("Bloque C · 2 y 6-nov","<b>Viernes 6 (laboratorio): Práctica 3</b> y lecciones de defensa de sistemas.","")+bk("Bloque D y evaluación · lunes 9-nov","Vulnerabilidades, ética y herramientas; los alumnos terminan y entregan el reporte en la actividad de la plataforma (organización asignada a cada uno). La actividad se desbloquea al completar este material.","")+bk("Nota","Las herramientas como Nmap y Wireshark solo se usan en una red de práctica autorizada por ti.","sp"),"Las fechas vienen de tu cronograma 1-26/27; ajústalas si cambia.")

s0:{k:"Introducción",l:"0",ic:"🏥",t:"Empieza aquí",d:"De qué trata el R.A. y repaso de lo que necesitas de los R.A. anteriores.",time:"50 min",obj:["Distinguir integridad, disponibilidad y confidencialidad","Recordar qué es un host, un servidor y una red","Recordar qué es cifrar y qué son las claves pública y privada","Pasar porcentajes a decimales"],sum:["¿La vieron? → confidencialidad · ¿La cambiaron? → integridad · ¿No funciona? → disponibilidad.","Host = un equipo · Servidor = el que atiende a todos · Red = lo que los conecta.","Porcentaje a decimal: divide entre 100."],q:"¿Qué servicio que usas a diario sería un problema si se cayera un día entero?"},
a:{k:"Bloque A",l:"A",ic:"🧬",t:"Controles de integridad",d:"Hash, contraseñas con sal, HMAC, firmas, certificados y bases de datos.",time:"120 min",obj:["Explicar las 3 reglas del hash","Explicar por qué las contraseñas se guardan con hash y sal","Elegir entre hash, HMAC, firma digital y certificado"],sum:["El hash es una huella sin regreso: mismo dato → misma huella; una letra distinta → huella distinta.","La sal hace que contraseñas iguales tengan hashes distintos.","HMAC = hash + clave compartida · Firma = clave privada (no repudio) · Certificado = de quién es la clave pública."],q:"¿Por qué una página nunca debería poder enviarte tu contraseña por correo si la olvidas?"},

d:{k:"Bloque D",l:"D",ic:"🧭",t:"Dominio de la ciberseguridad",d:"Vulnerabilidades, ética y herramientas.",time:"60 min",obj:["Leer un CVE y clasificar su CVSS","Aplicar las 3 preguntas de la ética","Relacionar cada herramienta con su palabra clave"],sum:["CVE = nombre de la falla · CVSS = qué tan grave (0 a 10).","Sin permiso por escrito no se prueba nada.","Puertos → Nmap · Tráfico → Wireshark · Fallas → escáner · Contraseñas → gestor · Archivo → VirusTotal."],q:"¿Qué harías si encuentras una falla en la página de tu escuela?",rev:[["Separar el wifi de pacientes de la red interna es…",["Segmentación de red","Seguridad física","Un hash"],0,"Protege la conexión: capa red (VLAN)."],["El servidor debe tener…",["Solo los servicios necesarios","Todos los puertos abiertos","Una sola contraseña para todos"],0,"Menos servicios, menos puertas."]]}
