mas. Tus tres prácticas son la base.<\/p><div class=\"hint\">💡 Responde siempre para TU organización: cada sección debe mencionar sus datos (servicios, incidente y tiempo sin servicio).<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Contexto<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Describe la organización asignada, la información que maneja y los servicios que no pueden detenerse.<\/span><\/label><h3>Integridad (Bloque A)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Explica cómo usarías hash con sal, HMAC o firma digital y certificados, y cómo cuidarías la integridad de su base de datos.<\/span><\/label><h3>Estándar (Bloque B)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Propón redundancia para sus puntos únicos de falla y calcula su disponibilidad.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Define respaldos, RPO y RTO de acuerdo con el tiempo máximo sin servicio.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Describe las 4 fases de respuesta para su incidente reciente.<\/span><\/label><h3>Defensa de sistemas (Bloque C)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Medidas para host, servidor, red y seguridad física.<\/span><\/label><h3>Dominio (Bloque D)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Una vulnerabilidad real (CVE y CVSS) que afectaría a la organización y cómo la corregirías.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Principios éticos y herramientas que usarías con autorización.<\/span><\/label><h3>Entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Llena las secciones de la actividad en la plataforma y adjunta tu reporte en PDF.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Contexto de la organización<\/td><td>10<\/td><\/tr><tr><td>Controles de integridad<\/td><td>20<\/td><\/tr><tr><td>Disponibilidad, RPO/RTO y respuesta al incidente<\/td><td>25<\/td><\/tr><tr><td>Defensa de sistemas en 4 capas<\/td><td>20<\/td><\/tr><tr><td>Vulnerabilidad, ética y herramientas<\/td><td>15<\/td><\/tr><tr><td>Redacción y presentación<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un archivo PDF con tu reporte.<\/li><li>Se entrega en la actividad R.A. 2.2 de la plataforma, junto con las secciones escritas.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";

pL("🏥","¿Se puede confiar en la información?","De qué trata este R.A.",sp("En palabras sencillas","En el R.A. 2.1 viste cómo mantener la información en secreto (confidencialidad). Ahora vas a ver cómo comprobar que <b>nadie la alteró</b> (integridad), cómo lograr que <b>siempre esté disponible</b> y cómo <b>defender</b> los equipos.")+ex("Caso de las lecciones: Clínica dental Sonríe","Tiene expedientes de pacientes, una agenda de citas en línea y un sistema de cobro. Si alguien cambia una alergia en un expediente, es peligroso. Si la agenda se cae, pierden pacientes. Vamos a protegerla paso a paso.")+bk("Al final","Elaboras un <b>reporte</b> (15%) con la organización que te asigna la plataforma en la actividad de evaluación.",""),"Integridad = que no cambie · Disponibilidad = que funcione cuando se necesita."),
pA("🔺","¿Qué pilar se afecta?","Elige el pilar de la seguridad que se daña en cada situación de la clínica.",[["Alguien cambia la alergia de un paciente en su expediente", "Integridad"], ["La agenda en línea no abre en todo el día", "Disponibilidad"], ["Un empleado publica radiografías de un paciente", "Confidencialidad"], ["Un virus modifica los montos de los cobros", "Integridad"], ["Se va la luz y el servidor no enciende", "Disponibilidad"]],"Secreto = confidencialidad · Sin cambios = integridad · Que funcione = disponibilidad.",["Confidencialidad", "Integridad", "Disponibilidad"]),
pL("🧬","Hash: la huella digital de los datos","Bloque A · Controles de integridad",sp("En palabras sencillas","Un <b>hash</b> es un algoritmo que convierte cualquier dato en un <b>resumen de tamaño fijo</b> (su «huella»). SHA-256 siempre da 64 caracteres, sea una palabra o una película.")+bk("Tres propiedades","1) El mismo dato siempre da la misma huella. 2) Si cambia <b>una sola letra</b>, la huella cambia por completo. 3) No se puede regresar de la huella al dato original.","")+ana("Piensa en…","Tu huella dactilar: te identifica, pero con la huella no se puede reconstruir tu cara. O un licuado: no puedes volver a sacar el plátano entero.")+ex("En la clínica","Se guarda la huella de cada expediente. Si mañana la huella ya no coincide, alguien lo modificó.")+bk("Algoritmos viejos","MD5 y SHA-1 ya no son seguros. Hoy se usa SHA-256 o superior.","wn"),"Misma entrada → misma huella; un cambio mínimo → huella totalmente distinta."),
pHash(),
pA("🧬","¿Qué pasa con la huella?","Usa lo que viste en el laboratorio de hash.",[["Calculo el hash de «Hola» dos veces", "Sale la misma huella"], ["Cambio «Hola» por «hola»", "Sale una huella totalmente distinta"], ["Tengo solo la huella y quiero el texto original", "No se puede obtener"], ["Hago el hash de un archivo de 2 GB con SHA-256", "Sale una huella de 64 caracteres"]],"Recuerda las tres propiedades del hash.",["Sale la misma huella", "Sale una huella totalmente distinta", "No se puede obtener", "Sale una huella de 64 caracteres"]),
pL("🧂","La técnica salting","Bloque A · Guardar contraseñas de forma segura",sp("En palabras sencillas","Las contraseñas nunca se guardan tal cual: se guarda su hash. La <b>sal</b> es un valor aleatorio, distinto para cada usuario, que se agrega a la contraseña <b>antes</b> de calcular el hash.")+bk("¿Por qué?","Sin sal, dos personas con la contraseña «123456» tendrían el mismo hash, y un atacante podría usar <b>tablas precalculadas</b> (tablas arcoíris) con millones de hashes de contraseñas comunes.","")+ana("Piensa en…","Dos personas piden el mismo platillo, pero el cocinero le pone a cada uno un ingrediente secreto distinto: ya no saben igual.")+ex("En la clínica","La recepcionista y el dentista usan la misma contraseña por coincidencia. Gracias a la sal, en la base de datos sus hashes son diferentes.")+bk("Para contraseñas","Se usan algoritmos lentos a propósito, como <b>bcrypt</b> o <b>Argon2</b>, que ya incluyen la sal.",""),"Contraseña + sal → hash. La sal se guarda junto al hash; la contraseña no."),
pO("🧂","Ordena: guardar una contraseña","Pon en orden lo que hace el sistema cuando creas tu contraseña.",[["El usuario escribe su contraseña nueva", "Todo empieza con la contraseña en texto claro."], ["El sistema genera una sal aleatoria para ese usuario", "Cada usuario recibe una sal diferente."], ["Junta la sal con la contraseña y calcula el hash", "El hash se calcula sobre sal + contraseña."], ["Guarda la sal y el hash; la contraseña se descarta", "Nunca se guarda la contraseña original."], ["Al iniciar sesión repite el cálculo y compara los hashes", "Si coinciden, la contraseña es correcta."]],"La contraseña original nunca se guarda."),
pL("🔏","HMAC: hash con clave secreta","Bloque A · Comprobar quién lo envió",sp("En palabras sencillas","<b>HMAC</b> combina un hash con una <b>clave secreta</b> que solo conocen el emisor y el receptor. Comprueba que el mensaje no cambió <b>y</b> que lo envió alguien que conoce la clave.")+ana("Piensa en…","Un sobre sellado con lacre y tu sello personal: si alguien lo abre, se nota, y solo tú tienes ese sello.")+ex("En la clínica","El laboratorio envía resultados a la clínica con un HMAC. Si alguien intercepta el mensaje y cambia un valor, el HMAC ya no coincide y la clínica lo rechaza."),"Hash solo = ¿cambió? · HMAC = ¿cambió y quién lo envió?"),
pL("✍️","Firmas digitales y certificados","Bloque A · Identidad en internet",sp("Firma digital","Se crea con la <b>clave privada</b> del emisor y cualquiera la verifica con su <b>clave pública</b>. Asegura integridad, autenticidad y <b>no repudio</b> (el emisor no puede negar que firmó).")+sp("Certificado digital","Documento emitido por una <b>autoridad certificadora</b> que dice «esta clave pública pertenece a esta persona o a este sitio». Es lo que usa HTTPS.")+ana("Piensa en…","La firma es tu firma autógrafa; el certificado es tu INE: una autoridad confiable garantiza que esa firma es tuya.")+ex("En México","La <b>e.firma</b> del SAT es una firma digital con certificado. Las facturas electrónicas (CFDI) van firmadas digitalmente."),"Privada para firmar, pública para verificar."),
pL("🗃️","Integridad en bases de datos","Bloque A · Que los datos guardados sean correctos",bk("Llave primaria","Un identificador único: no puede haber dos pacientes con el mismo número de expediente.","")+bk("Llave foránea","Relaciona tablas: no se puede registrar una cita de un paciente que no existe.","")+bk("Validaciones y restricciones","Reglas como «la fecha de nacimiento no puede ser del futuro» o «el teléfono lleva 10 dígitos».","")+bk("Transacciones","Todo o nada: al cobrar, se registra el pago y se marca la cita como pagada, o no se hace ninguna de las dos.","")+bk("Respaldos y bitácoras","Permiten regresar a un estado correcto y saber quién cambió qué.",""),"La base de datos también se protege con reglas, no solo con contraseñas."),
pA("🧰","¿Qué control de integridad usas?","Elige la herramienta para cada necesidad.",[["Guardar las contraseñas de los empleados", "Hash con sal"], ["Que el laboratorio pruebe que el resultado no cambió y que lo envió él", "HMAC"], ["Que el dentista firme recetas electrónicas sin poder negarlo después", "Firma digital"], ["Que los pacientes comprueben que la página de citas es la verdadera", "Certificado digital"], ["Que no existan dos expedientes con el mismo número", "Llave primaria"]],"Contraseñas → sal · Mensaje con clave → HMAC · Firmar → firma · Identidad del sitio → certificado · Datos únicos → llave primaria.",["Hash con sal", "HMAC", "Firma digital", "Certificado digital", "Llave primaria"]),
pZ("🗃️","Completa las reglas de la base de datos","Elige la palabra correcta para cada regla de la clínica.","<p>El número de expediente es la {0}: no se repite.</p><p>La tabla Citas usa una {1} para que cada cita pertenezca a un paciente que sí existe.</p><p>Al cobrar, el pago y el estado de la cita se guardan en una {2}: se hace todo o nada.</p><p>La regla «el teléfono lleva 10 dígitos» es una {3}.</p><p>Las contraseñas se guardan como {4}.</p>",[["llave primaria", ["llave primaria", "llave foránea", "contraseña"]], ["llave foránea", ["llave foránea", "llave primaria", "sal"]], ["transacción", ["transacción", "firma", "bitácora"]], ["validación", ["validación", "transacción", "llave foránea"]], ["hash con sal", ["hash con sal", "texto claro", "llave primaria"]]],"Única → primaria · Relación → foránea · Todo o nada → transacción."),
pL("🛞","Disponibilidad y alta disponibilidad","Bloque B · Que el servicio no se detenga",sp("En palabras sencillas","<b>Disponibilidad</b> es que el servicio funcione cuando se necesita. <b>Alta disponibilidad</b> es diseñarlo para que siga funcionando aunque algo falle.")+bk("Punto único de falla","Una pieza que, si falla, detiene todo: un solo disco, un solo servidor, un solo proveedor de internet.","")+bk("Redundancia","Tener repuesto: discos en <b>RAID</b>, dos fuentes de poder, <b>UPS</b> (no-break), dos proveedores de internet, servidores en <b>clúster</b> y <b>balanceo de carga</b>.","")+ana("Piensa en…","La llanta de refacción del coche: no evita ponchar, pero te deja seguir.")+ex("En la clínica","El servidor de la agenda tiene dos discos en espejo (RAID 1) y un no-break. Si un disco falla o se va la luz, la agenda sigue."),"Encuentra el punto único de falla y ponle repuesto."),
pL("9️⃣","Los «nueves» de la disponibilidad","Bloque B · Cómo se mide",bk("99 %","Hasta 3.65 días fuera de servicio al año.","")+bk("99.9 % (tres nueves)","Unas 8.76 horas al año.","")+bk("99.99 % (cuatro nueves)","Unos 52.6 minutos al año.","")+bk("99.999 % (cinco nueves)","Poco más de 5 minutos al año.","")+ex("Cómo se calcula","Un año tiene 8,760 horas. Con 99.9 %, el tiempo fuera es el 0.1 %: 8,760 × 0.001 = <b>8.76 horas</b>."),"Cada nueve extra cuesta más dinero y reduce el tiempo caído 10 veces."),
pT("🧮","Calcula el tiempo fuera de servicio","Escribe solo el número. Un año = 8,760 horas.",[["Un servicio tiene 99 % de disponibilidad. ¿Cuántas horas puede estar caído al año?", "87.6", "8,760 × 0.01 = 87.6 horas.", "El 1 % de 8,760.", "m", 0.05], ["Con 99.9 %, ¿cuántas horas al año?", "8.76", "8,760 × 0.001 = 8.76 horas.", "El 0.1 % de 8,760.", "m", 0.01], ["La agenda estuvo caída 4 horas de las 100 que debía funcionar esta semana. ¿Qué porcentaje estuvo disponible?", "96", "(96 ÷ 100) × 100 = 96 %.", "Resta las horas caídas y divide entre el total.", "m", 0.05], ["Con 99.99 %, ¿cuántos minutos al año? (redondea a un decimal)", "52.6", "8,760 × 0.0001 = 0.876 h × 60 = 52.56 ≈ 52.6 minutos.", "Calcula las horas y multiplica por 60.", "m", 0.1]],"Tiempo fuera = total × (100 − disponibilidad) ÷ 100.","m"),
pL("🏰","Defensa en profundidad","Bloque B · Varias capas de protección",sp("En palabras sencillas","Poner <b>varias capas de protección</b>, para que si una falla, las demás sigan protegiendo.")+bk("Las capas","Políticas y capacitación → seguridad física → red → equipo (host) → aplicación → datos.","")+ana("Piensa en un castillo","Foso, muralla, guardias, puerta y caja fuerte. Un ladrón tendría que vencerlas todas.")+ex("En la clínica","Aunque un empleado abra un correo falso (falla la capacitación), el antivirus lo bloquea; y si no, los expedientes están cifrados y respaldados."),"Nunca confíes en una sola protección."),
pL("🚨","Respuesta a incidentes","Bloque B · Qué hacer cuando algo pasa",sp("En palabras sencillas","Un incidente es un evento que daña la seguridad: un virus, un robo de datos, un servidor caído. La respuesta sigue fases para no improvisar.")+bk("1. Preparación","Antes de que pase: plan, responsables, respaldos y herramientas.","")+bk("2. Detección y análisis","Darse cuenta y entender qué pasó y qué tan grave es.","")+bk("3. Contención, erradicación y recuperación","Aislar el problema, eliminar la causa y volver a funcionar.","")+bk("4. Lecciones aprendidas","Revisar qué falló y mejorar para que no se repita.","")+ana("Piensa en un simulacro de sismo","Te preparas antes, actúas con orden durante y revisas qué mejorar después."),"Preparar · detectar · contener y recuperar · aprender."),
pL("🌪️","Recuperación tras un desastre: RPO y RTO","Bloque B · Volver a funcionar",sp("En palabras sencillas","El plan de recuperación dice cómo volver a funcionar después de un desastre: incendio, inundación, ransomware.")+bk("RPO · ¿cuánta información puedo perder?","Si respaldas cada noche, en el peor caso pierdes un día de datos: RPO = 24 horas.","")+bk("RTO · ¿en cuánto tiempo debo volver?","El tiempo máximo para que el servicio regrese. Si la clínica dice «la agenda debe volver en 2 horas», RTO = 2 h.","")+bk("Regla 3-2-1","3 copias, en 2 tipos de soporte, 1 fuera del lugar (por ejemplo, en la nube).","")+ana("Piensa en…","Guardar la partida del videojuego: el RPO es cada cuánto guardas; el RTO es cuánto tardas en volver a jugar."),"RPO mira hacia atrás (datos perdidos); RTO mira hacia adelante (tiempo para volver)."),
pO("🚨","Ordena la respuesta a un ransomware","La clínica descubre que sus archivos están cifrados. Ordena lo que deben hacer.",[["Tener respaldos y un plan antes de que pase", "Preparación: sin respaldos no hay recuperación."], ["Detectar los archivos cifrados y analizar qué equipos están afectados", "Detección y análisis."], ["Desconectar de la red los equipos infectados", "Contención: evita que se extienda."], ["Eliminar el malware y restaurar los respaldos", "Erradicación y recuperación."], ["Revisar cómo entró y capacitar al personal", "Lecciones aprendidas."]],"Antes, durante y después."),
pA("⏱️","¿RPO o RTO?","Decide de qué meta habla cada frase.",[["Respaldamos cada 4 horas, así que perderíamos máximo 4 horas de datos", "RPO"], ["La agenda debe volver a funcionar en menos de 1 hora", "RTO"], ["No podemos perder más de un día de cobros", "RPO"], ["El sistema de cobro puede estar caído máximo medio día", "RTO"]],"Datos perdidos = RPO · Tiempo para volver = RTO.",["RPO", "RTO"]),
pA("🛞","¿Qué mecanismo usarías?","Elige la solución de alta disponibilidad para cada riesgo.",[["Que falle un disco del servidor", "RAID (discos en espejo)"], ["Que se vaya la luz", "UPS (no-break) o planta de luz"], ["Que se caiga el internet", "Segundo proveedor de internet"], ["Que un solo servidor no aguante tantas visitas", "Balanceo de carga"], ["Que se incendie la clínica", "Respaldo fuera del lugar (nube)"]],"Relaciona cada riesgo con su repuesto."),
pL("💻","Protección del host","Bloque C · Cada computadora",sp("En palabras sencillas","Un <b>host</b> es cualquier equipo conectado: la PC de recepción, la laptop del dentista, el celular.")+bk("Medidas","Actualizaciones al día · antivirus o EDR · firewall local · cuenta estándar para trabajar · bloqueo de pantalla · cifrado del disco (BitLocker).","")+ex("En la clínica","La PC de recepción usa cuenta estándar, se bloquea sola a los 5 minutos y tiene el disco cifrado."),"Ya lo conoces de ASIN y del R.A. 2.1: cada equipo se protege a sí mismo."),
pL("🗄️","Protección del servidor","Bloque C · El equipo que da servicio a todos",bk("Menos es más","Desactivar servicios y puertos que no se usan: cada servicio abierto es una puerta.","")+bk("Mínimo privilegio","Cuentas de administrador solo para quien las necesita, con contraseñas fuertes y doble factor.","")+bk("Bitácoras y monitoreo","Registrar accesos y cambios, y revisarlos.","")+bk("Respaldos y parches","Respaldar a diario y aplicar actualizaciones en una ventana de mantenimiento.","")+ana("Piensa en…","La bodega de una tienda: pocas puertas, pocas llaves, cámara y registro de quién entra."),"Un servidor seguro tiene pocas puertas abiertas y alguien vigilándolas."),
pL("🌐","Protección de la red","Bloque C · Lo que une a todos",bk("Firewall perimetral","Filtra lo que entra y sale de internet.","")+bk("Segmentación (VLAN)","Separa la red: pacientes en el wifi de invitados, equipos médicos en otra red, administración en otra.","")+bk("IDS / IPS","Detectan (y el IPS bloquea) tráfico sospechoso.","")+bk("VPN","Túnel cifrado para conectarse desde fuera.","")+bk("Wifi seguro","<b>WPA2</b> o <b>WPA3</b> con contraseña fuerte; nunca una red abierta para los equipos internos.",""),"Separar la red evita que un problema en un lado llegue a todo."),
pL("🔐","Seguridad física","Bloque C · Lo que se puede tocar",bk("Control de acceso","El cuarto del servidor bajo llave o con tarjeta; solo entra personal autorizado.","")+bk("Vigilancia","Cámaras y registro de visitas.","")+bk("Energía y ambiente","UPS, regulador, ventilación y extintor adecuado para equipo eléctrico.","")+bk("Equipos y medios","Candados para laptops, destruir discos viejos antes de tirarlos.","")+bk("Recuerda","De nada sirve el mejor firewall si alguien puede entrar y llevarse el servidor.","wn"),"La seguridad empieza por la puerta."),
pA("🧱","¿Qué capa protege?","Clasifica cada medida.",[["Cifrar el disco de la laptop del dentista", "Host"], ["Desactivar en el servidor los servicios que no se usan", "Servidor"], ["Separar el wifi de pacientes de la red interna", "Red"], ["Poner llave al cuarto del servidor", "Física"], ["Instalar un IDS que avise de tráfico raro", "Red"], ["Usar cuenta estándar en la PC de recepción", "Host"], ["Instalar un no-break para el servidor", "Física"]],"Un equipo → host · El que da servicio → servidor · Conexiones → red · Lo que se toca → física.",["Host", "Servidor", "Red", "Física"]),
pA("⚖️","¿Buena o mala práctica?","Decide si cada práctica de la clínica es buena o mala.",[["Dejar abierto el escritorio remoto del servidor a todo internet", "Mala práctica"], ["Usar WPA3 con contraseña fuerte en la red interna", "Buena práctica"], ["Que todos usen la cuenta de administrador para ir más rápido", "Mala práctica"], ["Tirar a la basura un disco viejo con expedientes sin borrarlo", "Mala práctica"], ["Revisar cada semana las bitácoras del servidor", "Buena práctica"]],"Pregúntate: ¿abre una puerta o la cierra?",["Buena práctica", "Mala práctica"]),
pW("✍️","Defiende la clínica en 4 capas","Aplica lo aprendido.","Escribe una medida para cada capa de la clínica: <b>host</b>, <b>servidor</b>, <b>red</b> y <b>física</b>.",[["Tiene al menos 25 palabras", "palabras:25"], ["Una medida para el host (equipo, PC, laptop, antivirus, cifrado…)", "\\b(host|pc|computadora\\w*|laptop\\w*|equipos?|antivirus|bitlocker|cifr\\w+)\\b"], ["Una medida para el servidor", "\\bservidor\\w*\\b"], ["Una medida para la red (firewall, VLAN, wifi, IDS, VPN…)", "\\b(red|redes|firewall|vlan|wifi|ids|ips|vpn|wpa\\w*)\\b"], ["Una medida física (llave, cámara, no-break, acceso…)", "\\b(llave\\w*|camara\\w*|no-?break|ups|acceso fisico|cuarto\\w*|candado\\w*|tarjeta\\w*|fisic\\w+)\\b"]],"Una oración por capa.","Ejemplo: Host: las PCs tienen antivirus y disco cifrado. Servidor: …"),
pL("🐞","Vulnerabilidades: CVE y CVSS","Bloque D · Dominio de vulnerabilidades",sp("En palabras sencillas","Una <b>vulnerabilidad</b> es una falla en un programa o equipo que un atacante puede aprovechar. Las que se hacen públicas reciben un identificador <b>CVE</b>, por ejemplo CVE-2024-12345.")+bk("CVSS","Calificación de 0 a 10 para saber qué tan grave es: <b>Baja</b> 0.1–3.9 · <b>Media</b> 4.0–6.9 · <b>Alta</b> 7.0–8.9 · <b>Crítica</b> 9.0–10.","")+bk("Dónde consultarlas","<b>cve.org</b> y la base del NIST (<b>nvd.nist.gov</b>).","")+ana("Piensa en…","Los avisos de «llamado a revisión» de los coches: el fabricante publica la falla, su número y qué tan peligrosa es, para que la arregles.")+ex("En la clínica","El sistema de citas tiene una CVE con CVSS 9.8: es crítica y se actualiza hoy mismo. Una de 3.1 se programa para el siguiente mantenimiento."),"Primero se corrigen las críticas y altas."),
pA("🐞","Clasifica la gravedad","Según su calificación CVSS, ¿qué tan grave es cada vulnerabilidad?",[["CVE con CVSS 9.8", "Crítica"], ["CVE con CVSS 5.3", "Media"], ["CVE con CVSS 7.5", "Alta"], ["CVE con CVSS 2.1", "Baja"], ["CVE con CVSS 10.0", "Crítica"]],"Baja < 4 · Media < 7 · Alta < 9 · Crítica 9 o más.",["Baja", "Media", "Alta", "Crítica"]),
pL("🧭","Ética y principios rectores","Bloque D · Saber mucho exige responsabilidad",sp("En palabras sencillas","Quien sabe de ciberseguridad puede proteger o dañar. La ética marca la diferencia.")+bk("Autorización por escrito","Solo se revisa o prueba un sistema con permiso firmado del dueño. Sin permiso es un delito: el Código Penal Federal castiga el acceso ilícito a sistemas (artículos 211 bis 1 al 211 bis 7).","")+bk("Privacidad","Proteger los datos personales que veas durante tu trabajo.","")+bk("No causar daño","Probar sin afectar el servicio ni la información.","")+bk("Divulgación responsable","Reportar las fallas al dueño y darle tiempo de corregirlas antes de hacerlas públicas.","")+ex("Hacker ético","Una empresa contrata a una especialista para atacar su propia red y encontrar fallas antes que los delincuentes. Firma un contrato con lo que puede y no puede hacer."),"Mismo conocimiento, distinta intención: el permiso lo cambia todo."),
pA("🧭","¿Es ético?","Decide si cada acción es ética o no.",[["Escanear la red de la escuela por curiosidad, sin pedir permiso", "No es ético"], ["Reportar al dueño una falla que encontraste en su página", "Es ético"], ["Publicar en redes los datos de pacientes que viste en una auditoría", "No es ético"], ["Hacer una prueba de penetración con contrato firmado", "Es ético"], ["Usar la contraseña de un compañero que dejó su sesión abierta", "No es ético"]],"Pregúntate: ¿tengo permiso?, ¿protejo la privacidad?, ¿causo daño?",["Es ético", "No es ético"]),
