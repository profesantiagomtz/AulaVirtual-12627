icas: revisa esta lista con tu presentación abierta y marca cada punto.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Contenido y vistas<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Archivo <b>Apellido_Nombre_EDOA21.pptx<\/b> con al menos 6 diapositivas: portada, un encabezado de sección y al menos 4 de contenido.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Orden lógico revisado en las vistas Esquema y Clasificador.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Notas del orador en cada diapositiva de contenido.<\/span><\/label><h3>Diseño de la diapositiva<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Tamaño Panorámica 16:9, orientación horizontal.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> El mismo fondo (o el del tema) en todas las diapositivas.<\/span><\/label><h3>Estilos<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Diseño de diapositiva adecuado en cada una (título, sección, título y objetos, dos objetos).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Máximo dos fuentes; títulos de 32 a 44 pt y texto de 24 a 28 pt; buen contraste.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Listas con viñetas o numeración, alineación e interlineado adecuados; regla 6 × 6.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Sin faltas de ortografía.<\/span><\/label><h3>Plantillas<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>10.<\/b> Un tema aplicado (o una plantilla predeterminada).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>11.<\/b> Patrón de diapositivas con logotipo y pie «CONALEP · Informática · Grupo 311».<\/span><\/label><h3>Entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>12.<\/b> Revisa la presentación completa con F5.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>13.<\/b> Sube tu archivo .pptx (o su PDF) en la actividad R.A. 2.1 de la plataforma.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Seis diapositivas con orden lógico y notas<\/td><td>15<\/td><\/tr><tr><td>Tamaño, orientación y fondo uniformes<\/td><td>15<\/td><\/tr><tr><td>Diseño de diapositiva adecuado<\/td><td>15<\/td><\/tr><tr><td>Fuentes, tamaños y contraste legibles<\/td><td>20<\/td><\/tr><tr><td>Párrafos: viñetas, alineación, interlineado y 6 × 6<\/td><td>15<\/td><\/tr><tr><td>Tema y patrón con logotipo y pie<\/td><td>15<\/td><\/tr><tr><td>Ortografía<\/td><td>5<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un archivo .pptx (o PDF) de máximo 20 MB.<\/li><li>Nombre del archivo: Apellido_Nombre_EDOA21.<\/li><li>Súbelo en la actividad R.A. 2.1 de la plataforma.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
