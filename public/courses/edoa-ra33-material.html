ction><h2>Entrega<\/h2><ul><li>Un archivo .xlsm (o .xlsx/PDF con capturas).<\/li><li>Nombre del archivo: Apellido_Nombre_EDOA33.<\/li><li>Súbelo en la actividad R.A. 3.3 de la plataforma y entrega la impresión en clase.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
