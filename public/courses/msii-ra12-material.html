 Descripción escrita de la función validada de las unidades funcionales · Soportes de información realizados<\/div><div><b>Ponderación<\/b>20% (según el programa)<\/div><\/div><\/section>\n<section><h2>Situación<\/h2><p>Con un equipo del laboratorio, instala y documenta tres periféricos, describe y valida con datos reales cómo trabajan las unidades principales del sistema y crea respaldos en distintos soportes. Si quieres un contexto, imagina que eres el técnico del Cibercafé Nova.<\/p><div class=\"hint\">💡 Realiza la práctica en un equipo de cómputo (o en tu celular) y marca cada paso conforme lo termines.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Dispositivos periféricos (evidencia 1)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Elige 3 periféricos disponibles: uno de <b>entrada<\/b>, uno de <b>salida<\/b> y uno de <b>entrada/salida<\/b>.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Conecta cada uno y comprueba que el sistema operativo lo detecte. Revisa su controlador en el <b>Administrador de dispositivos<\/b> (teclas Win + X).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Si hace falta, instala o actualiza el controlador y prueba que funcione.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Redacta el <b>procedimiento de instalación<\/b> paso a paso, con capturas de pantalla de cada dispositivo.<\/span><\/label><h3>Unidades funcionales (evidencia 2)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Abre el <b>Administrador de tareas<\/b> (Ctrl + Mayús + Esc), pestaña Rendimiento, y registra el modelo y la velocidad de la CPU, el número de núcleos y la memoria total.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Describe con tus palabras la función de la <b>CPU<\/b>, la <b>ALU<\/b> y la <b>memoria central<\/b>.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Valida tu descripción con los datos reales que registraste (por ejemplo, cuánta memoria se usa al abrir 3 programas).<\/span><\/label><h3>Soportes de información (evidencia 3)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Crea una <b>copia de seguridad<\/b> de una carpeta de trabajo en <b>dos tipos de soporte distintos<\/b> (por ejemplo memoria USB y nube o disco externo).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Protege uno de los respaldos con contraseña o cifrado, con la herramienta que tengas disponible.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>10.<\/b> Elabora una tabla con cada soporte usado: tipo (magnético, óptico, híbrido o flash), capacidad, método de acceso y cuánto espacio ocupa el respaldo.<\/span><\/label><h3>Entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>11.<\/b> Revisa que cada evidencia tenga título, tu nombre y capturas claras.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>12.<\/b> Guarda los tres documentos con tu apellido y nombre.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Procedimiento de instalación: 3 periféricos con capturas<\/td><td>30<\/td><\/tr><tr><td>Descripción de CPU, ALU y memoria validada con datos reales<\/td><td>25<\/td><\/tr><tr><td>Respaldos en dos soportes distintos y tabla de soportes<\/td><td>25<\/td><\/tr><tr><td>Protección o cifrado de un respaldo<\/td><td>10<\/td><\/tr><tr><td>Formato, redacción y entrega<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Documento del <b>procedimiento de instalación de dispositivos periféricos<\/b>.<\/li><li>Documento con la <b>descripción validada de las unidades funcionales<\/b>.<\/li><li><b>Soportes de información realizados<\/b>: respaldos y su tabla.<\/li><li>Entrégalos en la sesión de recapitulación y entrega de evidencias.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";

pL("➗","El cifrado como fórmula","Taller · Paso 5: matemáticas del cifrado",sp("En palabras sencillas","Si numeras las letras de A=0 a Z=25, cifrar es sumar la clave y quedarte con el residuo al dividir entre 26. Esa operación se llama <b>módulo</b> (mod).")+bk("Cifrar","C = (P + k) mod 26")+bk("Descifrar","P = (C − k) mod 26")+ex("Ejemplo","Letra Y (24) con k = 5: (24 + 5) = 29. Como 29 − 26 = 3, queda la letra D.")+bk("Ojo con los negativos","Si restas y sale negativo, suma 26. Ejemplo: (4 − 7) = −3 → −3 + 26 = 23.","wn"),"El módulo es como un reloj: al llegar al final, vuelves al inicio."),
pL("🔓","Romper el código: fuerza bruta","Taller · Paso 6: ¿qué tan seguro es el César?",sp("En palabras sencillas","El César solo tiene <b>25 claves posibles</b>. Cualquiera puede probar todas hasta que aparezca un mensaje con sentido. A eso se le llama <b>fuerza bruta</b>.")+bk("¿Por qué es débil?","Con una computadora, probar 25 claves toma menos de un segundo.")+bk("Otra pista","Las letras más comunes en español (E, A, O) delatan la clave.")+ex("Prueba tú","En la Rueda de César puedes probar claves hasta que el texto tenga sentido."),"Un cifrado fácil de romper no protege información importante."),
pL("🗝️","Más fuerte: clave de varias letras","Taller · Paso 7: el cifrado Vigenère",sp("En palabras sencillas","En lugar de una sola clave, se usa una <b>palabra clave</b>. Cada letra de la palabra indica cuánto desplazar una letra del mensaje (A=0, B=1, C=2…) y se repite.")+ex("Ejemplo","Mensaje CASA, clave BC (1 y 2): C+1=D, A+2=C, S+1=T, A+2=C → DCTC.")+bk("¿Por qué es mejor?","La misma letra puede cifrarse de formas distintas, así que es más difícil de romper."),"Es un paso hacia métodos de cifrado más seguros."),
pT("🔢","Decimal a binario","Escribe cada número en binario (solo ceros y unos).",[["Escribe 5 en binario","101","4 + 1 = 5 → 101.","Usa los valores 4, 2 y 1."],["Escribe 9 en binario","1001","8 + 1 = 9 → 1001.","Usa 8, 4, 2 y 1."],["Escribe 13 en binario","1101","8 + 4 + 1 = 13 → 1101.","Primero el 8, luego el 4 y el 1."],["Escribe 20 en binario","10100","16 + 4 = 20 → 10100.","Empieza con el 16."]],"Resta los valores de 128, 64, 32, 16, 8, 4, 2 y 1 que quepan.","n"),
pT("🔡","Letras y ASCII","Usa lo que vimos del código ASCII. Escribe solo números.",[["Valor ASCII de la letra A","65","La A mayúscula vale 65.","Las mayúsculas empiezan en 65."],["Valor ASCII de la letra B","66","B va después de A: 66.","Es el siguiente número después de la A."],["Valor ASCII de la letra a (minúscula)","97","Las minúsculas empiezan en 97.","Las minúsculas empiezan en 97."],["Valor ASCII de la letra Z","90","Z cierra las mayúsculas: 90.","A=65 y hay 26 letras."],["65 en binario (8 bits)","01000001","65 = 64 + 1 = 01000001.","64 + 1"]],"Primero busca el número y, si piden binario, conviértelo.","n"),
pT("🏛️","César: la tabla (clave 3)","Escribe la letra en la que se convierte, con desplazamiento 3.",[["A →","D","A + 3 lugares = D.","Cuenta 3 letras después de A."],["B →","E","B + 3 lugares = E.","Cuenta 3 letras después de B."],["X →","A","X, Y, Z y se da la vuelta: A.","Al llegar a Z, vuelve a la A."],["Y →","B","Y, Z, A y B: queda B.","Da la vuelta al terminar el alfabeto."],["Z →","C","Z + 3 = C (vuelta al inicio).","Z → A → B → C."]],"Cuenta con los dedos sobre el alfabeto si lo necesitas.","u"),
pT("✉️","Cifra palabras (clave 3)","Cifra cada palabra con César, desplazamiento 3. Escribe en mayúsculas.",[["SOL","VRO","S→V, O→R, L→O.","Cada letra se mueve 3 lugares hacia adelante."],["LUZ","OXC","L→O, U→X, Z→C.","Z da la vuelta a la C."],["DATO","GDWR","D→G, A→D, T→W, O→R.","D+3=G, A+3=D…"],["CLAVE","FODYH","C→F, L→O, A→D, V→Y, E→H.","V+3=Y"]],"Revisa tu resultado letra por letra.","u"),
pT("🔓","Descifra mensajes (clave 3)","Estos mensajes están cifrados con clave 3. Descífralos (hacia atrás).",[["KROD","HOLA","K→H, R→O, O→L, D→A.","Retrocede 3 lugares en cada letra."],["VHJXULGDG","SEGURIDAD","V→S, H→E, J→G, U→R, X→U… queda SEGURIDAD.","Retrocede 3: V→S."],["FRPSXWDGRUD","COMPUTADORA","F→C, R→O, P→M, S→P, X→U, W→T, D→A, G→D, R→O, U→R, D→A.","Retrocede 3 en cada letra."]],"Descifrar es lo contrario de cifrar: retroceder.","u"),

pT("➗","Cifrado con fórmula","Usa C = (P + k) mod 26, con A = 0, B = 1 … Z = 25.",[["H vale 7 y k = 5. Calcula (7 + 5) mod 26","12","7 + 5 = 12.","12 es menor que 26: se queda igual.","n"],["Y vale 24 y k = 5. Calcula (24 + 5) mod 26","3","29 − 26 = 3.","29 se pasa de 26: réstale 26.","n"],["¿Qué letra tiene la posición 3?","D","A=0, B=1, C=2, D=3.","Cuenta desde A=0."],["Cifra HOLA con k = 7 usando la fórmula","OVSH","H(7)→14=O, O(14)→21=V, L(11)→18=S, A(0)→7=H.","Suma 7 a la posición de cada letra."]],"Convierte letras a números, calcula y vuelve a letras.","u"),
pT("↩️","Descifra con la fórmula inversa","Usa P = (C − k) mod 26. Si sale negativo, suma 26.",[["Calcula (4 − 7) mod 26","23","4 − 7 = −3, y −3 + 26 = 23.","Si sale negativo, suma 26.","n"],["¿Qué letra tiene la posición 23?","X","A=0 … X=23.","Cuenta desde A=0 hasta 23."],["Descifra OVSH con k = 7","HOLA","O(14)−7=7=H, V(21)−7=14=O, S(18)−7=11=L, H(7)−7=0=A.","Resta 7 a la posición de cada letra."],["Descifra ORV GDWRV con k = 3","LOSDATOS","ORV→LOS y GDWRV→DATOS.","Retrocede 3 en cada letra; escribe todo junto."]],"Restar es lo contrario de sumar.","u"),
pT("🕵️","Rompe el código (fuerza bruta)","El mensaje ST FGWFX JSQFHJX WFWTX se cifró con un César de clave desconocida. Usa la Rueda de César para probar claves.",[["¿Cuál es la clave? (un número)","5","Con clave 5 el mensaje se lee con sentido.","Prueba claves en la Rueda hasta que se lea algo.","n"],["¿Qué dice el mensaje? (todo junto, sin espacios)","NOABRASENLACESRAROS","NO ABRAS ENLACES RAROS.","Descifra con la clave que encontraste."]],"Si el texto no tiene sentido, esa clave no es.","u"),
pT("🗝️","Reto Vigenère (clave BC)","La clave BC desplaza las letras 1, 2, 1, 2… (B=1, C=2). Cifra y descifra.",[["Cifra CASA con la clave BC","DCTC","C+1=D, A+2=C, S+1=T, A+2=C.","Alterna: suma 1, suma 2, suma 1, suma 2."],["Cifra DATOS con la clave BC","ECUQT","D+1=E, A+2=C, T+1=U, O+2=Q, S+1=T.","Alterna 1 y 2 empezando en 1."],["Cifra REDES con la clave BC","SGEGT","R+1=S, E+2=G, D+1=E, E+2=G, S+1=T.","Alterna 1 y 2 empezando en 1."],["Descifra DCTC con la clave BC","CASA","D−1=C, C−2=A, T−1=S, C−2=A.","Resta 1, 2, 1, 2."]],"Lleva la cuenta de qué desplazamiento toca en cada letra.","u"),
pL("🧠","La CPU: el cerebro","Bloque B · Unidad central de procesos",sp("En palabras sencillas","La <b>CPU</b> (unidad central de procesos) es la parte que <b>ejecuta las instrucciones</b> de los programas. Por dentro tiene tres piezas importantes.")+bk("Unidad de control","Dirige: busca cada instrucción y le dice a las demás piezas qué hacer.")+bk("ALU","Calcula y compara (lo vemos enseguida).")+bk("Registros","Pequeños espacios muy rápidos para datos que se usan ahora mismo.")+ex("En el cibercafé","Cada vez que abres el navegador, la CPU ejecuta millones de instrucciones por segundo."),"La velocidad se mide en GHz y los núcleos permiten hacer varias tareas a la vez."),
pL("➗","La ALU: la calculadora","Bloque B · Unidad aritmético-lógica",sp("En palabras sencillas","La <b>ALU</b> hace dos tipos de operaciones: <b>aritméticas</b> (sumar, restar, multiplicar, dividir) y <b>lógicas</b> (comparar si algo es igual, mayor o menor, o combinar condiciones).")+ex("En el cibercafé","Aritmética: horas × tarifa = total a cobrar. Lógica: ¿el cliente pagó al menos el total? Sí o no."),"La ALU forma parte de la CPU."),
pL("⚡","Memoria central (RAM)","Bloque B · El escritorio de trabajo",sp("En palabras sencillas","La <b>memoria central</b> guarda temporalmente lo que la CPU está usando: programas y datos abiertos. Es muy rápida, pero es <b>volátil</b>: al apagar el equipo, se borra.")+ana("Piensa en…","Un escritorio y un archivero. El disco es el archivero (guarda todo, es más lento); la RAM es el escritorio (solo cabe lo que usas ahora, pero está a la mano).")+bk("RAM","Memoria de trabajo. Volátil.")+bk("ROM","Memoria que guarda lo básico para arrancar y no se borra al apagar."),"Más RAM permite tener más programas abiertos sin que el equipo se ponga lento."),
pL("🔁","El ciclo de instrucción","Bloque B · Cómo trabaja la CPU paso a paso",sp("En palabras sencillas","Para cada instrucción, la CPU repite un ciclo: <b>busca</b> la instrucción en la memoria, la <b>decodifica</b> (entiende qué pide), la <b>ejecuta</b> y <b>guarda</b> el resultado.")+ex("En el cibercafé","Instrucción: «multiplicar horas × tarifa». Busca la orden, entiende que es una multiplicación, la calcula y guarda el total."),"Este ciclo se repite millones de veces por segundo."),
