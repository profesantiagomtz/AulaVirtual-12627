argin:14px 0}\nh2{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--pri)}h3{margin:16px 0 6px;font-size:15.5px}\n.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dl div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px}.dl b{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}\n.st{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;font-size:15.5px}.st input{width:20px;height:20px;flex:none;margin-top:3px}.st.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}\n.pr{position:sticky;top:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:650;font-size:14px;z-index:3;margin-top:12px}.pr i{display:block;height:6px;border-radius:3px;background:var(--ok);width:0;margin-top:5px;transition:width .2s}\ntable{width:100%;border-collapse:collapse;font-size:14.5px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}th{color:var(--mut);font-size:12px;letter-spacing:.05em;text-transform:uppercase}td:last-child,th:last-child{text-align:center;width:64px}\n.hint{border-left:4px solid var(--amb);background:var(--exb);border-radius:4px 12px 12px 4px;padding:10px 14px;font-size:14.5px;margin-top:12px}\nul{margin:4px 0;padding-left:20px}:focus-visible{outline:3px solid var(--amb);outline-offset:2px}\n@media (max-width:480px){.dl{grid-template-columns:1fr}.top h1{font-size:21px}}@media print{.pr{display:none}body{background:#fff}}\n<\/style><\/head><body><main>\n<div class=\"top\"><small>ASIN-20 · Aplicación de la seguridad informática · Unidad 1<\/small><h1>R.A. 1.2 · Plan y políticas de seguridad<\/h1><\/div>\n<section><h2>Datos de la actividad<\/h2><div class=\"dl\"><div><b>Resultado de aprendizaje<\/b>Elabora el plan de seguridad en cómputo acorde con los riesgos determinados y estándares de protección.<\/div><div><b>Actividad de evaluación<\/b>1.2.1 Elabora el plan de seguridad informática basado en estándares internacionales, estableciendo mecanismos de protección de la información y métricas de evaluación.<\/div><div><b>Evidencia<\/b>Plan de seguridad a implementar y políticas de seguridad a implementar<\/div><div><b>Ponderación<\/b>20% (según el programa)<\/div><\/div><\/section>\n<section><h2>Situación<\/h2><p>Elige una organización real o ficticia (la escuela, una papelería, una clínica, una tienda en línea) y elabora su <b>plan de seguridad informática<\/b> y sus <b>políticas de seguridad<\/b>. Apóyate en los riesgos que determinaste en el R.A. 1.1. Si no se te ocurre una organización, usa la Papelería Don Beto de las fichas.<\/p><div class=\"hint\">💡 Elabora tus documentos en Word (o en tu celular) y marca cada paso conforme lo termines.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Contexto<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Describe la organización en un párrafo: qué hace, cuántos equipos y usuarios tiene y qué información debe proteger.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Enlista los <b>activos<\/b> más importantes y al menos <b>3 riesgos<\/b> con su nivel (alto, medio o bajo).<\/span><\/label><h3>Modelos y estándares<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Elige un modelo de buenas prácticas (<b>ITIL, COBIT o ISM3<\/b>) y explica en 3 renglones por qué lo usarías.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Elige los estándares que aplicarás (por ejemplo <b>ISO 27001, ISO 27002<\/b> y otra norma de la serie 27000) y explica para qué sirve cada una.<\/span><\/label><h3>Plan de seguridad (evidencia 1)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Describe los <b>elementos de protección<\/b> que usarás: antivirus, firewall, respaldos, control de acceso, capacitación, etc.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Define al menos <b>3 metas<\/b> de seguridad medibles, con su periodo (por ejemplo, «el 100% de los equipos con antivirus actualizado en 2 meses»).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Define las <b>métricas<\/b>: mínimo 4 indicadores con fórmula, meta, frecuencia y responsable de medirlos.<\/span><\/label><h3>Políticas de seguridad (evidencia 2)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Redacta al menos <b>6 políticas<\/b> de la lista del curso (acceso físico, acceso lógico, cuentas de usuario, bitácoras, firewall, software de seguridad, actualizaciones, control de cambios, almacenamiento, archivos compartidos o respaldo).<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Cada política debe llevar: objetivo, alcance, responsables y reglas concretas.<\/span><\/label><h3>Entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>10.<\/b> Revisa ortografía, usa títulos y numera las páginas.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>11.<\/b> Guarda el plan y las políticas como <b>dos documentos<\/b> con tu apellido y nombre.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Contexto, activos y riesgos<\/td><td>10<\/td><\/tr><tr><td>Modelo y estándares elegidos y justificados<\/td><td>15<\/td><\/tr><tr><td>Elementos de protección y metas medibles<\/td><td>20<\/td><\/tr><tr><td>Políticas (6 completas con objetivo, alcance, responsables y reglas)<\/td><td>25<\/td><\/tr><tr><td>Métricas e indicadores con fórmula, meta y frecuencia<\/td><td>20<\/td><\/tr><tr><td>Formato, redacción y entrega<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Documento del <b>Plan de seguridad a implementar<\/b>.<\/li><li>Documento de las <b>Políticas de seguridad a implementar<\/b>.<\/li><li>Entrégalos en la sesión de recapitulación y entrega de evidencias.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
