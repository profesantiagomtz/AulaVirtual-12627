ox\"><span><b>12.<\/b> Cambia un dato y comprueba que los resultados se actualizan.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>13.<\/b> Sube tu archivo .xlsx (o su PDF) en la actividad R.A. 3.2 de la plataforma y entrega la versión impresa en clase.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Fórmulas básicas con operadores<\/td><td>15<\/td><\/tr><tr><td>Referencias relativas, absolutas y mixtas<\/td><td>15<\/td><\/tr><tr><td>Nombres, matriz y varias hojas<\/td><td>10<\/td><\/tr><tr><td>Funciones matemáticas y estadísticas<\/td><td>20<\/td><\/tr><tr><td>Funciones de fecha, texto y búsqueda<\/td><td>15<\/td><\/tr><tr><td>Funciones lógicas<\/td><td>15<\/td><\/tr><tr><td>Presentación y versión impresa<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un archivo .xlsx (o PDF) con todas tus hojas.<\/li><li>Nombre del archivo: Apellido_Nombre_EDOA32.<\/li><li>Súbelo en la actividad R.A. 3.2 de la plataforma y entrega la impresión en clase.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
