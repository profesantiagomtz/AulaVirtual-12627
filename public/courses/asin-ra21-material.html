pT("🧮","Calcula si alcanza","Escribe solo el número. Recuerda: 1 GB = 1024 MB.",[["La caja tiene 3 GB libres. ¿Cuántos MB son?", "3072", "3 × 1024 = 3072 MB.", "Multiplica los GB por 1024.", "n"], ["Un programa pide 1500 MB y hay 3072 MB libres. ¿Cuántos MB quedan libres después de instalarlo?", "1572", "3072 − 1500 = 1572 MB.", "Resta lo que ocupa el programa.", "n"], ["El programa pide 4 GB de RAM y la PC tiene 16 GB. ¿Cuántas veces cabe el mínimo en lo que tiene?", "4", "16 ÷ 4 = 4 veces. Cumple de sobra.", "Divide lo que tiene entre lo que pide.", "n"], ["Un instalador pesa 300 MB. Si lo descargas en cada una de las 5 computadoras, ¿cuántos MB descargas en total?", "1500", "300 × 5 = 1500 MB. En el Bloque B verás cómo un servidor central evita descargar lo mismo varias veces.", "Multiplica por el número de computadoras.", "n"]],"Lee con calma qué te piden: convertir, restar, dividir o multiplicar.","n"),
pL("🩹","Actualizaciones: parches para los hoyos","Bloque B · Configuración local",sp("En palabras sencillas","Una actualización es una <b>corrección que publica el fabricante</b> para tapar una falla de seguridad (vulnerabilidad) o mejorar el programa.")+bk("Piensa en…","Una llanta ponchada: el parche cierra el hoyo antes de que se desinfle. Sin parche, cualquier clavo la vuelve a ponchar.","")+ex("En la papelería","Si la caja no se actualiza, un virus puede entrar por una falla que <b>ya tenía arreglo</b> desde hace meses.")+bk("Dato importante","Muchos ataques aprovechan fallas que ya tenían parche, pero nadie lo instaló.","wn"),"Equipo actualizado = protegido contra lo que ya se conoce."),
pL("⏰","Actualizaciones automáticas sin que estorben","Bloque B · Que se instalen solas, a buena hora",bk("Windows","<b>Configuración › Windows Update</b>. Déjalas automáticas y ajusta las <b>Horas activas</b>: el horario en que Windows no reiniciará la computadora.","")+bk("Aplicaciones","La <b>Microsoft Store</b> y los navegadores se actualizan solos si no lo desactivas. En el celular, activa la actualización automática en la Play Store.","")+ex("Don Beto","La papelería abre de 8:00 a 21:00. Pone esas horas activas: así la caja se actualiza y reinicia en la noche, no a mitad de una venta.")+bk("No hagas esto","Pausar las actualizaciones «para siempre» porque tardan. Solo se pausan unos días si hay una razón, y luego se instalan.","wn"),"Automáticas sí, pero fuera del horario de trabajo."),

pL("🏢","Servidores centrales de actualizaciones","Bloque B · Cuando hay muchas computadoras",sp("En palabras sencillas","Un servidor central <b>descarga las actualizaciones una sola vez y las reparte</b> a todas las computadoras de la red. El administrador decide cuáles se aprueban. En Windows se llama <b>WSUS</b>.")+bk("Piensa en…","La tiendita de la colonia: compra al mayoreo y reparte, en vez de que cada vecino vaya hasta la central de abastos.","")+ex("¿Quién lo usa?","Tu escuela, con decenas de computadoras, sí lo necesita. Don Beto, con 5, puede usar las actualizaciones automáticas normales.")+bk("Ventajas","Ahorra internet, el administrador prueba antes de instalar y sabe qué equipo está atrasado.",""),"Muchas computadoras = un servidor central que controla las actualizaciones."),

pL("👤","Cuentas de usuario: cada quien la suya","Bloque B · Quién entra y qué puede hacer",sp("En palabras sencillas","Una cuenta es tu <b>llave personal</b> para entrar a la computadora. Hay dos tipos: <b>Administrador</b> (puede instalar y cambiar todo) y <b>Estándar</b> (usa los programas, pero no cambia la configuración).")+bk("Piensa en…","Las llaves del local: Don Beto tiene la llave de todo; los empleados, solo la de la entrada.","")+bk("Regla de oro: privilegio mínimo","Cada persona recibe <b>solo los permisos que necesita</b> para su trabajo. Ni uno más.","")+ex("Don Beto","Administrador: solo él, con contraseña fuerte. Cajera y empleados: cuenta estándar, una por persona. Las 3 computadoras de renta: una cuenta estándar «Cliente», sin acceso a la oficina.")+bk("Errores comunes","Compartir la misma cuenta entre todos, usar la cuenta de administrador para trabajar a diario y no poner contraseña.","wn"),"Una cuenta por persona y el permiso justo."),
pL("🔐","Cómo se administran las cuentas","Bloque B · Dónde se hace en Windows",bk("Agregar o cambiar cuentas","<b>Configuración › Cuentas › Otros usuarios</b>. Ahí se agrega una cuenta y se cambia su tipo (administrador o estándar). Necesitas ser administrador.","")+bk("Inicio de sesión","<b>Configuración › Cuentas › Opciones de inicio de sesión</b>: contraseña o PIN.","")+bk("Bloquear al levantarte","Presiona <b>Win + L</b>. La sesión queda cerrada con tu contraseña y nadie usa tu cuenta.","")+ex("Política de cuentas de Don Beto","1) Cada empleado tiene su cuenta estándar. 2) Contraseña de al menos 10 caracteres. 3) Se bloquea la sesión al dejar la caja. 4) Al salir un empleado, se desactiva su cuenta ese mismo día."),"Win + L antes de levantarte."),
pA("👥","¿Qué tipo de cuenta le das?","Aplica el privilegio mínimo a cada persona.",[["Don Beto, el dueño que instala programas", "Administrador"], ["La cajera, que solo cobra", "Estándar"], ["Los clientes en las computadoras de renta", "Estándar"], ["El ayudante que imprime y escanea", "Estándar"], ["La cuenta con la que se cambia la configuración del firewall", "Administrador"]],"Si no instala ni cambia configuraciones, le basta una cuenta estándar.",["Administrador", "Estándar"]),

pL("🧱","Firewall local: el portero de tu computadora","Bloque B · Qué conexiones entran y salen",sp("En palabras sencillas","Un firewall es un <b>filtro que decide qué conexiones entran y salen</b> del equipo, según reglas. El firewall <b>local</b> vive en cada computadora: en Windows es el <b>Firewall de Windows Defender</b>.")+bk("Piensa en…","El portero de un edificio con una lista: si estás en la lista, pasas; si no, no.","")+bk("Perfiles de red","<b>Privada</b>: tu casa o la papelería, donde confías. <b>Pública</b>: un café o la escuela, donde se desconfía más. Debe estar activado en todos.","")+bk("Reglas","De <b>entrada</b> (lo que llega al equipo) y de <b>salida</b> (lo que sale). Se pueden permitir o bloquear programas.","")+bk("Dónde se ve","<b>Seguridad de Windows › Firewall y protección de red</b>.","")+bk("Nunca","Desactivar el firewall «para que funcione un juego». Si algo necesita pasar, se crea una regla solo para eso.","wn"),"Firewall activo en todos los perfiles, y reglas solo para lo necesario."),
pL("🛡️","Política de antivirus","Bloque B · Reglas para que el antivirus sí proteja",sp("En palabras sencillas","El antivirus <b>detecta, bloquea y elimina programas maliciosos</b>. La política dice cómo debe usarse para que no sea solo un ícono.")+bk("Dónde está","En Windows ya viene: <b>Seguridad de Windows › Protección antivirus y contra amenazas</b> (Microsoft Defender).","")+bk("Reglas típicas","1) Protección en tiempo real siempre activada. 2) Definiciones actualizadas a diario (automático). 3) Examen rápido cada semana y completo cada mes. 4) Toda memoria USB se analiza antes de abrirla. 5) Nadie lo desactiva.","")+ana("Cuarentena","Cuando encuentra algo sospechoso lo pone en cuarentena: lo aísla para que no contagie, como al enfermo en la enfermería. No se restaura sin revisar.")+ex("Don Beto","En las computadoras de renta los clientes conectan muchas USB: el análisis automático de USB es obligatorio."),"Tiempo real activo, definiciones al día y USB analizada."),
pL("🕵️","Spyware y antispyware","Bloque B · El programa espía",sp("En palabras sencillas","El <b>spyware</b> es un programa espía que se esconde y <b>roba lo que haces</b>: contraseñas, páginas visitadas o lo que tecleas (keylogger). El <b>antispyware</b> lo detecta; en Windows viene dentro de Microsoft Defender.")+bk("Señales","Anuncios raros, el navegador abre una página de inicio que no elegiste, extensiones que nadie instaló, la computadora lenta sin razón.","")+bk("Política antispyware","1) No instalar extensiones desconocidas. 2) Revisar las extensiones del navegador cada mes. 3) Examen completo si hay señales. 4) En el celular, revisar qué apps usan micrófono, cámara y ubicación.","")+ex("Riesgo en la papelería","Un cliente entra a su correo en una computadora de renta con un keylogger: le roban la contraseña. Por eso se cierran las sesiones y se revisan los equipos."),"El spyware no se nota: hay que buscarlo con reglas."),

pL("📁","Permisos de archivos y carpetas","Bloque B · Quién puede ver, cambiar o borrar",sp("En palabras sencillas","Los permisos dicen <b>quién puede ver, cambiar o borrar</b> una carpeta o un archivo.")+bk("👁️ Lectura","Solo puede abrir y ver.","")+bk("✏️ Modificar","Puede ver, cambiar y borrar.","")+bk("👑 Control total","Todo lo anterior y además cambiar los permisos de otros.","")+bk("Dónde se ve","Clic derecho en la carpeta › <b>Propiedades › Seguridad</b>.","")+ana("Piensa en…","Un cuaderno de la clase: unos solo lo pueden leer, otros pueden escribir en él y el dueño decide quién lo usa.")+ex("Carpeta «Precios»","Cajera: Lectura. Ayudante que actualiza precios: Modificar. Don Beto: Control total. Clientes: sin acceso."),"Privilegio mínimo también en las carpetas."),

pL("🔒","Cifrado de archivos y carpetas","Bloque B · Que nadie entienda tus datos sin la clave",sp("En palabras sencillas","Cifrar es <b>convertir la información en un código</b> que solo se puede leer con la contraseña o la llave correcta.")+bk("Piensa en…","Un diario con candado y escrito en clave: aunque te lo roben, no lo entienden.","")+bk("En Windows","<b>EFS</b>: clic derecho › Propiedades › Opciones avanzadas › Cifrar contenido (Windows Pro). <b>BitLocker</b>: cifra todo el disco (Windows Pro).","")+bk("Con 7-Zip","Comprime la carpeta con contraseña y método <b>AES-256</b>. Funciona en cualquier Windows.","")+bk("En el celular","Android cifra el teléfono cuando tienes bloqueo de pantalla. La app <b>Files de Google</b> tiene una «Carpeta segura» con PIN.","")+bk("Cuidado","Si olvidas la contraseña no hay forma de recuperar los archivos. Guárdala en un lugar seguro.","wn")+ex("Don Beto","Su laptop con las facturas usa BitLocker. El respaldo en USB va comprimido con 7-Zip y contraseña."),"Si te roban el equipo, el cifrado protege la información."),

pL("🏰","Firewall perimetral: la reja de toda la red","Bloque C · Configuración de red",sp("En palabras sencillas","El firewall perimetral <b>protege toda la red</b> en el punto donde se conecta a internet (el «perímetro»). Puede ser el router o un equipo especial.")+bk("Piensa en…","La reja del fraccionamiento (perimetral) y la puerta de cada casa (local). Se usan los dos: si uno falla, queda el otro.","")+bk("Reglas típicas","1) Bloquear todo lo que entra sin que nadie lo haya pedido. 2) Permitir solo lo necesario: navegar y el sistema de cobro. 3) Separar la red de los clientes de la red de la caja.","")+ex("Don Beto","Activa el firewall del router y crea un <b>wifi de invitados</b> para los clientes: navegan, pero no pueden ver la caja ni la oficina."),"Local cuida un equipo; perimetral cuida a todos."),
pL("🚨","Sistema de detección de intrusos (IDS)","Bloque C · La alarma de la red",sp("En palabras sencillas","Un <b>IDS</b> vigila el tráfico de la red y <b>avisa</b> cuando ve algo sospechoso. Un <b>IPS</b> hace lo mismo y además lo <b>bloquea</b>.")+bk("Piensa en…","La alarma con sensores: no cierra la puerta (eso lo hace el firewall), pero suena y avisa cuando alguien entra.","")+bk("Cómo detecta","<b>Por firmas</b>: compara con ataques conocidos, como la ficha de un ladrón buscado. <b>Por anomalías</b>: nota lo que no es normal, como la caja enviando datos a las 3 de la mañana.","")+bk("Ejemplos","Snort y Suricata son IDS gratuitos muy usados. Algunos routers y firewalls ya traen uno.","")+ex("En la papelería","El IDS avisa a Don Beto cuando alguien prueba cientos de contraseñas contra el wifi."),"Firewall = reja · IDS = alarma · IPS = guardia que detiene."),
pA("🧱","¿Firewall, IDS o IPS?","Elige la herramienta que corresponde a cada descripción.",[["Bloquea las conexiones que no están en sus reglas", "Firewall"], ["Avisa que alguien está revisando qué equipos hay en la red", "IDS"], ["Detecta un ataque conocido y lo corta en ese momento", "IPS"], ["Funciona como la alarma con sensores", "IDS"], ["Funciona como la reja con lista de quién pasa", "Firewall"], ["Es como un guardia que ve al ladrón y lo detiene", "IPS"]],"Filtra con reglas → firewall · Solo avisa → IDS · Avisa y bloquea → IPS.",["Firewall", "IDS", "IPS"]),
pL("🔐","HTTPS: el candado del navegador","Bloque C · Protocolos de seguridad",sp("En palabras sencillas","<b>HTTPS</b> es HTTP (la forma en que viajan las páginas web) <b>sobre SSL/TLS</b>, una capa que cifra. Lo que escribes viaja en código, y un <b>certificado</b> demuestra que la página es quien dice ser.")+bk("Piensa en…","Una postal (HTTP): cualquiera que la toque la lee. Una carta en sobre sellado (HTTPS): solo la abre quien la recibe.","")+bk("Cómo reconocerla","La dirección empieza con <b>https://</b> y aparece el ícono del candado o de configuración. Al darle clic dice «La conexión es segura» y puedes ver el certificado: a quién se emitió, quién lo emitió y hasta cuándo es válido.","")+bk("Nota","SSL es el nombre antiguo; hoy se usa TLS, pero mucha gente sigue diciendo SSL.","")+bk("Cuidado","El candado dice que la conexión está cifrada, <b>no que la página sea honesta</b>. Una página falsa también puede tener HTTPS: revisa bien la dirección.","wn"),"Sin HTTPS no escribas contraseñas ni datos de tarjetas."),
pL("🚇","IPsec: un túnel seguro entre redes","Bloque C · Protocolos de seguridad",sp("En palabras sencillas","<b>IPsec</b> protege todos los paquetes que viajan entre dos equipos o dos redes: comprueba de quién vienen (autenticación) y los cifra. Se usa mucho en las <b>VPN</b>.")+bk("Piensa en…","Un túnel privado bajo la ciudad que une dos sucursales: lo que va dentro nadie lo ve desde la calle.","")+ex("Don Beto","Abre una segunda sucursal. Con una VPN con IPsec, la caja de la sucursal consulta el inventario de la papelería principal sin dejarlo expuesto en internet.")+bk("HTTPS o IPsec","HTTPS protege <b>una página web</b> en el navegador. IPsec protege <b>toda la comunicación</b> entre dos puntos, sin importar el programa.",""),"HTTPS = una página · IPsec = todo el camino entre dos redes."),

pL("📂","Carpetas compartidas en red: dos candados","Bloque C · Permisos por la red",sp("En palabras sencillas","Al compartir una carpeta en la red hay <b>dos tipos de permisos</b>: los de <b>recurso compartido</b> (Lectura, Cambiar o Control total, para quien entra por la red) y los de <b>Seguridad</b> que ya viste (Lectura, Modificar, Control total).")+bk("Regla","Por la red se aplica <b>el más restrictivo de los dos</b>.","")+bk("Piensa en…","Para entrar a un salón necesitas permiso en la puerta del edificio y en la del salón. Si una de las dos dice «solo mirar», solo miras.","")+ex("Carpeta «Precios» de Don Beto","Compartido: Cambiar para Empleados. Seguridad: Lectura. Por la red, la cajera <b>solo puede leer</b>.")+bk("Nunca","Compartir con «Todos» y Control total. Comparte solo lo necesario, con usuarios que tengan contraseña, y deja de compartir lo que ya no se usa.","wn"),"Dos candados: gana el más estricto."),
