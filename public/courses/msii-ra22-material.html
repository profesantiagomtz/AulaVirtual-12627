e comandos<\/b>.<\/p><div class=\"hint\">💡 Hazlo en Ubuntu (equipo o máquina virtual). Si no es posible, usa los simuladores del material y captura cada reto resuelto. Al final escribe history para armar tu listado.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Preparación<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Portada con tu nombre, grupo y fecha; objetivo de la sesión en 2 líneas.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Información del equipo: uname -a, lsblk, free -h y echo $XDG_CURRENT_DESKTOP.<\/span><\/label><h3>Archivos y procesos (A)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Estructura sucursal con 3 subcarpetas y archivos creados, copiados y movidos.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Procesos con ps aux y top; un proceso terminado con kill y una tarea programada en crontab.<\/span><\/label><h3>Discos (B)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Memoria USB o disco virtual formateado, montado en /mnt/usb, comprobado con df -h, agregado a fstab y revisado con fsck.<\/span><\/label><h3>Administración (C)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Usuarios ana, luis y beto con contraseña; grupos caja y soporte.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Carpeta /srv/caja con chown root:caja y chmod 770; prueba de acceso permitido y denegado.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> apt update, instalación de un programa, ufw activo y estado de CUPS.<\/span><\/label><h3>Procesos y memoria (D)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Proceso en segundo plano con nice, cambio de prioridad con renice y pausa/continuación con señales.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>10.<\/b> Explicación breve de los estados del proceso y de la memoria (RAM, swap, paginación).<\/span><\/label><h3>Reporte y listado<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>11.<\/b> Reporte: capturas en orden, cada una con qué hiciste y qué resultado obtuviste.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>12.<\/b> Listado de comandos en tabla: comando, para qué sirve y el ejemplo exacto que ejecutaste.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>13.<\/b> Conclusión: ¿qué ventajas tiene un sistema multiusuario bien administrado?<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Información del equipo<\/td><td>5<\/td><\/tr><tr><td>Archivos, procesos y cron<\/td><td>15<\/td><\/tr><tr><td>Discos: formato, montaje, fstab y fsck<\/td><td>15<\/td><\/tr><tr><td>Usuarios y grupos<\/td><td>15<\/td><\/tr><tr><td>Permisos y propietarios<\/td><td>15<\/td><\/tr><tr><td>Paquetes, seguridad e impresión<\/td><td>10<\/td><\/tr><tr><td>Prioridades y señales<\/td><td>10<\/td><\/tr><tr><td>Reporte con capturas explicadas<\/td><td>5<\/td><\/tr><tr><td>Listado de comandos completo<\/td><td>10<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un solo archivo PDF o Word con el reporte y el listado.<\/li><li>Nombre del archivo: Apellido_Nombre_Sesion_MSII22.<\/li><li>Súbelo en la actividad R.A. 2.2 de la plataforma.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";

pL("🔌","Montar y desmontar: mount y umount","Bloque B · Colgar el disco en el árbol",sp("En palabras sencillas","<b>Montar</b> es conectar una partición a una carpeta del árbol para poder usarla. La carpeta se llama <b>punto de montaje</b>.")+bk("Montar","<code>sudo mkdir /mnt/usb</code> (una vez) y luego <code>sudo mount /dev/sdb1 /mnt/usb</code>. Ahora lo que guardes en /mnt/usb va a la memoria.","")+bk("Comprobar","<code>df -h</code> muestra cuánto espacio tiene cada sistema montado; <code>lsblk</code> muestra el punto de montaje.","")+bk("Desmontar","<code>sudo umount /mnt/usb</code> antes de sacar la memoria (como «Quitar hardware de forma segura»). Si dice «ocupado», sal de esa carpeta con <code>cd ~</code>.","")+ana("Piensa en…","Enchufar una extensión a la pared: hasta que la conectas, los aparatos no tienen luz."),"mkdir punto → mount dispositivo punto → umount antes de retirar."),
pL("📄","El archivo de configuración fstab","Bloque B · Montar al arrancar",bk("Qué es","<b>/etc/fstab</b> es la lista de particiones que se montan solas al encender el equipo.","")+bk("Sus 6 columnas","<code>dispositivo  punto  tipo  opciones  dump  pass</code><br>Ejemplo: <code>/dev/sdb1 /mnt/usb ext4 defaults 0 2</code>","")+bk("pass","0 = no revisar · 1 = la raíz / · 2 = las demás (se revisan con fsck al arrancar).","")+bk("UUID","Es mejor usar <code>UUID=…</code> (lo da blkid) que /dev/sdb1, porque las letras pueden cambiar.","")+bk("Probar","Después de editar: <code>sudo mount -a</code> monta todo lo de fstab. Si marca error, corrígelo antes de reiniciar.","")+bk("Ojo","Un error en fstab puede impedir que el sistema arranque. Haz una copia antes: <code>sudo cp /etc/fstab /etc/fstab.bak</code>.","wn"),"fstab = qué se monta al arrancar · prueba con mount -a."),
pL("🩺","Integridad del sistema de ficheros","Bloque B · fsck",bk("Qué revisa","Después de un apagón o de sacar una USB sin desmontar, el sistema de archivos puede quedar con errores.","")+bk("fsck","<code>sudo fsck /dev/sdb1</code> revisa y repara. La partición debe estar <b>desmontada</b>.","")+bk("La raíz","La partición del sistema (/) no se revisa en uso: Linux la revisa sola al arrancar si hace falta.","")+bk("Espacio","<code>df -h</code> avisa cuando un disco se está llenando; arriba del 90% conviene limpiar.",""),"Desmontar → fsck → montar otra vez."),
pA("💽","¿Qué comando usas?","Elige el comando para cada tarea con la memoria USB.",[["Ver qué discos y particiones tiene el equipo", "lsblk"], ["Darle formato ext4 a la memoria", "mkfs.ext4"], ["Conectar la memoria a /mnt/usb", "mount"], ["Saber cuánto espacio libre queda en cada disco", "df -h"], ["Quitar la memoria con seguridad", "umount"], ["Revisar la memoria después de un apagón", "fsck"]],"Ver → lsblk · formatear → mkfs · conectar → mount · espacio → df · retirar → umount · revisar → fsck.",["lsblk", "mkfs.ext4", "mount", "df -h", "umount", "fsck"]),
pO("🔢","Ordena: preparar una memoria USB nueva","Pon los pasos en orden.",[["Identificar la partición con lsblk", "Primero confirma que es sdb1 y no sda."], ["Dar formato con sudo mkfs.ext4 /dev/sdb1", "Crea el sistema de archivos."], ["Crear el punto de montaje con sudo mkdir /mnt/usb", "La carpeta donde se colgará."], ["Montar con sudo mount /dev/sdb1 /mnt/usb", "La conecta al árbol."], ["Comprobar con df -h", "Debe aparecer /mnt/usb."], ["Desmontar con sudo umount /mnt/usb al terminar", "Antes de retirarla."]],"Identificar → formatear → carpeta → montar → comprobar → desmontar."),
pZ("📄","Completa la línea de fstab","Elige cada campo de la línea para montar la USB en /mnt/usb al arrancar.","<p><code>{0}  {1}  {2}  {3}  0  {4}</code></p>",[["/dev/sdb1", ["/dev/sdb1", "/mnt/usb", "ext4"]], ["/mnt/usb", ["/mnt/usb", "/dev/sdb1", "defaults"]], ["ext4", ["ext4", "swap", "/mnt"]], ["defaults", ["defaults", "ext4", "2"]], ["2", ["2", "1", "0"]]],"dispositivo · punto de montaje · tipo · opciones · dump · pass (2 para discos que no son la raíz)."),
pLx("💽","Prepara la memoria USB de respaldos","Terminal de Linux simulada: discos, formato, montaje y fstab.",{id:"tb",intro:"Llegó una memoria USB nueva para los respaldos de la sucursal. Prepárala para que se monte sola cada vez que enciendas el equipo. Recuerda que estas tareas necesitan <b>sudo</b>.",hint:"Para fstab: echo \"/dev/sdb1 /mnt/usb ext4 defaults 0 2\" | sudo tee -a /etc/fstab",tasks:[["Identifica la memoria con <b>lsblk</b> (es la que no está montada).",function(a){return a.used("lsblk")}],["Dale formato <b>ext4</b> a <b>/dev/sdb1</b>.",function(a){return a.disk.fs=="ext4"}],["Crea el punto de montaje <b>/mnt/usb</b> y monta la memoria ahí.",function(a){return a.used("mount:ok")}],["Comprueba el espacio con <b>df -h</b> mientras está montada.",function(a){return a.used("df")&&a.used("mount:ok")}],["Agrega la línea a <b>/etc/fstab</b> (con echo y sudo tee -a) para que se monte al arrancar.",function(a){return /^(\/dev\/sdb1|UUID=\S+)\s+\/mnt\/usb\s+ext4\s+\S+\s+0\s+2\s*$/m.test(a.text("/etc/fstab"))}],["Desmonta, revisa la integridad con <b>fsck</b> y vuelve a montar con <b>sudo mount -a</b>.",function(a){return a.used("fsck:ok")&&a.used("mount -a")&&a.disk.mnt=="/mnt/usb"}]]}),
pL("💿","Instalar Linux y el arranque GRUB","Bloque C · Instalación del sistema operativo",bk("Preparar","Descarga la imagen ISO de Ubuntu, grábala en una USB con <b>Rufus</b> o <b>balenaEtcher</b> y arranca la PC desde ella (tecla F12, F9 o Esc según la marca).","")+bk("Instalar","Idioma y teclado (Español-Latinoamérica) → tipo de instalación (borrar disco o junto a Windows) → zona horaria → usuario y contraseña → esperar → reiniciar y quitar la USB.","")+bk("GRUB","Es el <b>administrador de arranque</b>: el menú que aparece al encender y te deja elegir Ubuntu o Windows (arranque dual). Su configuración está en <b>/etc/default/grub</b> (por ejemplo GRUB_TIMEOUT=5 segundos).","")+bk("Actualizar GRUB","Después de cambiar su configuración o instalar otro sistema: <code>sudo update-grub</code>.","")+ana("Piensa en…","GRUB es el recepcionista que te pregunta a qué piso vas antes de subir al elevador."),"ISO en USB → instalar → GRUB elige el sistema al arrancar."),
pL("📦","Instalar aplicaciones","Bloque C · Gestor de paquetes apt",sp("En palabras sencillas","En Linux los programas se instalan desde <b>repositorios</b> (tiendas oficiales y seguras) con un <b>gestor de paquetes</b>. En Ubuntu es <b>apt</b>; también está la tienda gráfica «Centro de software».")+bk("Actualizar la lista","<code>sudo apt update</code> descarga la lista de programas disponibles. Hazlo primero.","")+bk("Instalar y quitar","<code>sudo apt install tree</code> · <code>sudo apt remove tree</code> · <code>apt search texto</code> para buscar.","")+bk("Actualizar todo","<code>sudo apt upgrade</code> instala las actualizaciones de seguridad de todo el sistema.","")+bk("Otros formatos","Paquetes <b>.deb</b> descargados, <b>Snap</b> y <b>Flatpak</b>.","")+bk("Seguridad","No instales programas de páginas desconocidas: usa los repositorios.","wn"),"update → install → upgrade, siempre con sudo."),
pL("🛡️","Administrador, sudo y root","Bloque C · Configuración y administración",bk("root","El superusuario: puede hacer <b>todo</b>, incluso destruir el sistema. Por eso en Ubuntu no se entra como root.","")+bk("sudo","Antepones <code>sudo</code> para ejecutar <b>un</b> comando como administrador. Te pide <b>tu</b> contraseña y solo funciona si perteneces al grupo <b>sudo</b>.","")+bk("Configurar el equipo","Nombre del equipo (<code>/etc/hostname</code>), red, fecha y hora, idioma: desde «Configuración» (gráfico) o con comandos.","")+bk("Servicios","<code>systemctl status cups</code> ve si un servicio corre; <code>sudo systemctl restart cups</code> lo reinicia.","")+bk("Regla de oro","Usa sudo solo cuando haga falta y entiende el comando antes de darle Enter.","wn"),"Trabaja como usuario normal y usa sudo solo para administrar."),
pL("👥","Administración de usuarios y grupos","Bloque C · Cuentas en un sistema multiusuario",bk("Crear usuario","<code>sudo useradd -m ana</code> (<code>-m</code> crea /home/ana) y luego <code>sudo passwd ana</code> para su contraseña. En Ubuntu también existe <code>sudo adduser ana</code>, que pregunta todo.","")+bk("Grupos","Un grupo junta usuarios que comparten permisos. <code>sudo groupadd caja</code> · <code>sudo usermod -aG caja ana</code> (la <b>-a</b> es importante: sin ella se le quitan sus otros grupos).","")+bk("Consultar","<code>id ana</code> o <code>groups ana</code>. Los usuarios se guardan en <b>/etc/passwd</b> y los grupos en <b>/etc/group</b>.","")+bk("Cambiar de usuario","<code>su - ana</code> entra como ana; <code>exit</code> regresa. <code>whoami</code> dice quién eres.","")+bk("Borrar","<code>sudo userdel -r ana</code> (-r borra también su carpeta).","")+ex("En la sucursal","Usuarios: <b>ana</b> y <b>luis</b> (cajeros) en el grupo <b>caja</b>; <b>beto</b> (técnico) en <b>soporte</b>. Cada quien con su contraseña."),"useradd -m + passwd · groupadd · usermod -aG · id."),
pL("🔐","Permisos de archivos y directorios","Bloque C · Quién puede hacer qué",bk("Leer ls -l","<code>-rwxr-x--- 1 ana caja … ventas.txt</code>: el primer carácter dice si es archivo (-) o carpeta (d); luego tres grupos de <b>rwx</b> para <b>dueño</b>, <b>grupo</b> y <b>otros</b>.","")+bk("r w x","<b>r</b> leer (4) · <b>w</b> escribir (2) · <b>x</b> ejecutar o entrar a la carpeta (1).","")+bk("Números","Se suman: rwx = 7, rw- = 6, r-x = 5, r-- = 4. <code>chmod 750 carpeta</code> → dueño todo, grupo leer y entrar, otros nada.","")+bk("Letras","<code>chmod u+x script.sh</code> agrega ejecutar al dueño · <code>chmod o-r archivo</code> quita leer a otros · <code>chmod g=rw archivo</code>.","")+bk("Dueño y grupo","<code>sudo chown ana:caja ventas.txt</code> cambia dueño y grupo (<code>-R</code> para toda una carpeta).","")+ex("Carpeta compartida de caja","<code>sudo mkdir /srv/caja</code> → <code>sudo chown root:caja /srv/caja</code> → <code>sudo chmod 770 /srv/caja</code>. Solo root y el grupo caja entran."),"r=4 w=2 x=1 · dueño-grupo-otros · chmod y chown."),
pL("🖨️","Impresoras, seguridad y ayuda","Bloque C · CUPS, mantenimiento y manuales",bk("CUPS","El sistema de impresión de Linux. Se administra desde el navegador en <b>http://localhost:631</b> o en Configuración › Impresoras. Comandos: <code>lpstat -p</code> impresoras · <code>lp archivo</code> imprimir · <code>lpstat -o</code> cola · <code>cancel id</code> cancelar.","")+bk("Mantenimiento y seguridad","Actualiza seguido (<code>sudo apt update && sudo apt upgrade</code>), activa el cortafuegos (<code>sudo ufw enable</code>), usa contraseñas fuertes, no compartas cuentas y revisa las bitácoras (<code>/var/log</code>).","")+bk("Ayuda del sistema","<code>man comando</code>, <code>comando --help</code>, <code>whatis</code>, <code>apropos palabra</code> y la documentación en línea de la distribución (help.ubuntu.com).",""),"CUPS imprime · ufw protege · man ayuda."),
pL("💬","Comunicación entre usuarios y variables de entorno","Bloque C · Hablar y configurar la sesión",bk("¿Quién está?","<code>who</code> y <code>w</code> muestran los usuarios conectados.","")+bk("Mensajes","<code>write ana</code> envía un mensaje a la terminal de ana; <code>wall \"Se reinicia el servidor a las 3\"</code> avisa a todos. <code>mesg n</code> bloquea mensajes.","")+bk("Variables de entorno","Datos que usan los programas: <code>$HOME</code> (tu carpeta), <code>$USER</code>, <code>$PATH</code> (dónde buscar comandos), <code>$SHELL</code>, <code>$LANG</code>.","")+bk("Usarlas","<code>echo $HOME</code> · <code>printenv</code> todas · <code>export SUCURSAL=Centro</code> crea una para esta sesión. Para que sea permanente, se agrega al archivo <b>~/.bashrc</b>.","")+ex("Comparación con Windows","Windows: %USERNAME% y SETX · Linux: $USER y export (+ .bashrc)."),"who · write · wall · echo $VAR · export."),
pL("🧪","Emuladores y máquinas virtuales","Bloque C · Probar Linux sin borrar Windows",sp("En palabras sencillas","Una <b>máquina virtual</b> es una computadora «de mentiras» dentro de tu computadora. Ahí instalas Linux y practicas sin tocar tu sistema.")+bk("VirtualBox","Gratuito (Oracle). Creas la VM, le asignas RAM (2–4 GB), disco (25 GB) y montas la ISO de Ubuntu.","")+bk("VMware Workstation Player","Gratuito para uso personal; muy estable.","")+bk("Vagrant","Crea máquinas virtuales con comandos: <code>vagrant init ubuntu/jammy64</code> y <code>vagrant up</code>. Útil para tener la misma VM en todo el laboratorio.","")+bk("Otras opciones","<b>WSL</b> (Linux dentro de Windows 10/11) y <b>Termux</b> en Android.","")+bk("Requisito","Activa la <b>virtualización</b> (VT-x o AMD-V) en el BIOS si la VM no arranca.","wn"),"VM = computadora dentro de tu computadora: practica sin riesgo."),
pA("🔐","¿Qué permisos son?","Elige el número que corresponde a cada permiso.",[["rwxr-x--- (dueño todo, grupo leer y entrar, otros nada)", "750"], ["rw-r--r-- (dueño lee y escribe, los demás solo leen)", "644"], ["rwxrwx--- (dueño y grupo todo, otros nada)", "770"], ["rw------- (solo el dueño lee y escribe)", "600"], ["rwxr-xr-x (todos leen y ejecutan; solo el dueño escribe)", "755"]],"Suma r=4, w=2, x=1 en cada grupo.",["750", "644", "770", "600", "755"]),
pA("👥","¿Qué comando de administración?","Elige el comando para cada tarea de la sucursal.",[["Crear la cuenta de luis con su carpeta personal", "sudo useradd -m luis"], ["Ponerle contraseña a luis", "sudo passwd luis"], ["Crear el grupo caja", "sudo groupadd caja"], ["Meter a luis al grupo caja sin quitarle sus otros grupos", "sudo usermod -aG caja luis"], ["Que la carpeta /srv/caja sea del grupo caja", "sudo chown root:caja /srv/caja"], ["Instalar el programa tree", "sudo apt install tree"]],"Usuarios → useradd/passwd · grupos → groupadd/usermod · dueño → chown · programas → apt.",["sudo useradd -m luis", "sudo passwd luis", "sudo groupadd caja", "sudo usermod -aG caja luis", "sudo chown root:caja /srv/caja", "sudo apt install tree"]),
pA("🧭","¿Cierto o falso?","Lee cada afirmación sobre administración en Linux.",[["Con sudo escribes la contraseña de root", "Falso"], ["usermod -G caja ana (sin -a) puede quitarle a ana sus otros grupos", "Cierto"], ["Un archivo con permisos 600 lo pueden leer los del grupo", "Falso"], ["GRUB es el menú que deja elegir el sistema al encender", "Cierto"], ["Antes de apt install conviene hacer apt update", "Cierto"], ["Una máquina virtual borra el Windows de tu computadora", "Falso"]],"Repasa las lecciones del bloque C.",["Cierto", "Falso"]),
pW("✍️","Explica tu decisión de permisos","Redacta como administrador.","La carpeta <b>/srv/caja</b> guarda las ventas del día. Explica en 2 o 3 oraciones qué <b>dueño, grupo y permisos</b> le pondrías y <b>por qué</b>.",[["Tiene al menos 15 palabras", "palabras:15"], ["Menciona el grupo (caja) o el dueño", "\\b(grupo|caja|dueno|propietario|root|chown)\\b"], ["Menciona permisos (números como 770 o letras rwx)", "\\b([0-7]{3}|rwx|lectura|escritura|leer|escribir|permis\\w*)\\b"], ["Explica por qué (para que, porque, así…)", "\\b(porque|para que|asi|ya que|evitar|solo)\\b"]],"Piensa: ¿quién debe entrar y quién no?","Le pondría dueño … y grupo … con permisos … porque …"),
pLx("👥","Da de alta al personal de la sucursal","Terminal de Linux simulada: usuarios, grupos y permisos.",{id:"tc",intro:"Llegaron dos cajeros y un técnico. Crea sus cuentas y una carpeta compartida solo para caja. Recuerda: administrar requiere <b>sudo</b>.",hint:"Si «su - ana» falla, revisa que tenga contraseña. Si ana no puede escribir, revisa grupo y permisos.",tasks:[["Crea los usuarios <b>ana</b> y <b>luis</b> con su carpeta personal y ponles contraseña.",function(a){return a.user("ana")&&a.user("luis")&&a.pw("ana")&&a.pw("luis")&&a.isDir("/home/ana")&&a.isDir("/home/luis")}],["Crea el grupo <b>caja</b> y agrega a ana y a luis.",function(a){return a.inGroup("ana","caja")&&a.inGroup("luis","caja")}],["Crea la carpeta <b>/srv/caja</b> (con sudo mkdir -p).",function(a){return a.isDir("/srv/caja")}],["Haz que su dueño sea <b>root</b> y su grupo <b>caja</b>.",function(a){return a.owner("/srv/caja")=="root:caja"}],["Ponle permisos <b>770</b>: root y caja todo, los demás nada.",function(a){return a.mode("/srv/caja")=="770"}],["Comprueba con <b>id ana</b> y <b>ls -l /srv</b>.",function(a){return a.used("id")&&a.used("ls -l")}],["Entra como ana (<b>su - ana</b>), escribe en /srv/caja un archivo <b>corte.txt</b> y regresa con <b>exit</b>.",function(a){return a.has("/srv/caja/corte.txt")&&a.me=="alumno"}],["Instala el programa <b>tree</b> (primero sudo apt update) y úsalo.",function(a){return a.pkg("tree")&&a.used("tree")}]]}),
pLx("🖨️","Impresora, seguridad y comunicación","Terminal de Linux simulada: CUPS, ufw, variables y mensajes.",{id:"tc2",intro:"Antes de abrir la sucursal, revisa la impresora, la seguridad y deja un aviso al personal.",hint:"Variables: export SUCURSAL=Centro y luego echo $SUCURSAL",tasks:[["Revisa que el servicio de impresión esté activo (<b>systemctl status cups</b>) y las impresoras con <b>lpstat -p</b>.",function(a){return a.used("systemctl")&&a.used("lpstat")}],["Imprime <b>notas.txt</b> con <b>lp</b> y revisa la cola con <b>lpstat -o</b>.",function(a){return a.used("lp:ok")&&a.S.used.lpstat}],["Actualiza el sistema: <b>sudo apt update</b> y <b>sudo apt upgrade</b>.",function(a){return a.S.upd&&a.used("apt:upgrade")}],["Activa el cortafuegos con <b>ufw</b> y revisa su estado.",function(a){return a.ufw}],["Crea la variable <b>SUCURSAL</b> con el valor <b>Centro</b> y muéstrala con echo.",function(a){return a.env("SUCURSAL")=="Centro"&&a.used("$SUCURSAL")}],["Avisa a todos con <b>wall</b> que el equipo se reinicia a las 15:00.",function(a){return a.used("wall")}]]}),
pL("🔄","Estados y operaciones de los procesos","Bloque D · Ciclo de vida de un proceso",bk("Ciclo de vida","<b>Nuevo</b> → <b>Listo</b> (espera su turno de CPU) → <b>Ejecución</b> → <b>Bloqueado/En espera</b> (espera un dato, el disco o la red) → vuelve a Listo → <b>Terminado</b>.","")+bk("Operaciones","Crear (un proceso padre crea un hijo con <i>fork</i>), suspender o pausar (<code>kill -STOP</code>), reanudar (<code>kill -CONT</code>), cambiar prioridad y terminar (<code>kill</code>).","")+bk("Padre e hijo","Cada proceso tiene un padre (<code>pstree</code> lo muestra). Un <b>zombie</b> es un hijo que terminó y su padre no ha leído su resultado; un <b>huérfano</b> es un hijo cuyo padre terminó (lo adopta systemd).","")+bk("Segundo plano","<code>comando &</code> · <code>jobs</code> lista · <code>fg %1</code> lo trae al frente · <code>kill %1</code> lo termina.","")+ana("Piensa en…","La fila de las tortillas: esperas (listo), te atienden (ejecución), vas por cambio (bloqueado), regresas a la fila."),"Nuevo → Listo → Ejecución ⇄ Bloqueado → Terminado."),
pL("🗓️","Planificación de procesos","Bloque D · ¿A quién le toca la CPU?",sp("En palabras sencillas","Hay cientos de procesos y pocos núcleos. El <b>planificador</b> del sistema decide quién usa la CPU y cuánto tiempo, tan rápido que parece que todo corre a la vez.")+bk("FCFS (FIFO)","El primero que llega, se atiende primero. Sencillo, pero uno largo hace esperar a todos.","")+bk("SJF","El trabajo más corto primero: reduce la espera promedio.","")+bk("Round Robin","Cada proceso recibe un <b>quantum</b> (porción de tiempo) por turnos. Es justo y es la base de los sistemas multiusuario.","")+bk("Por prioridad","Los importantes primero. En Linux la prioridad se ajusta con el valor <b>nice</b>: de <b>-20</b> (más prioridad) a <b>19</b> (menos). <code>nice -n 10 comando</code> inicia con menos prioridad; <code>renice 10 -p PID</code> cambia uno que ya corre. Bajar el número (subir prioridad) requiere sudo.","")+ex("En la sucursal","El respaldo nocturno corre con <code>nice -n 15</code> para no alentar a los clientes."),"Round Robin reparte turnos · nice: -20 más prioridad, 19 menos."),
pL("📡","Comunicación entre procesos","Bloque D · IPC",bk("Tuberías (pipes)","La salida de un proceso es la entrada de otro: <code>ps aux | grep firefox</code>.","")+bk("Señales","Avisos cortos: TERM (termina), KILL (fuerza), STOP (pausa), CONT (continúa), HUP (recarga configuración).","")+bk("Archivos y sockets","Compartir datos en archivos, o conectarse por red local o internet con <b>sockets</b> (así habla el navegador con un servidor).","")+bk("Memoria compartida y colas de mensajes","Zonas de memoria o buzones que usan varios procesos; necesitan <b>sincronización</b> (semáforos) para no pisarse.",""),"Tubería | · señales · archivos · sockets · memoria compartida."),
pL("🧠","Gestión de la memoria","Bloque D · RAM, swap y memoria virtual",bk("Qué hace","El sistema reparte la RAM entre los procesos, protege la memoria de cada uno y recupera la que liberan.","")+bk("Memoria virtual","Cada proceso cree tener toda la memoria para él; el sistema traduce esas direcciones «virtuales» a direcciones reales de la RAM.","")+bk("Swap","Cuando la RAM se llena, lo que no se usa se pasa al disco (swap). Es mucho más lento: si se usa mucho, el equipo «se arrastra».","")+bk("Ver","<code>free -h</code> (total, usado, libre, disponible y swap) · <code>top</code> (%MEM de cada proceso) · <code>vmstat</code> · <code>cat /proc/meminfo</code>.","")+bk("Ojo","En Linux «libre» suele verse bajo porque usa RAM sobrante como caché. Fíjate en «disponible».","wn"),"free -h: mira «disponible» y el uso de swap."),

function tot(){var a=atot(),p=pcnt();return [a[0]+p[0],a[1]+p[1]]}

/* Nombre y grupo del alumno: primero la sesión de la plataforma (mismo origen), luego lo que escribió en «Mi entrega». */
function alumno(){var s=null;try{s=JSON.parse(localStorage.getItem("aula-session")||"null")}catch(e){}
 var st=s&&s.role=="student"&&(!s.id||SID=="local"||s.id==SID)?s:{};
 return {name:(st.name||ST.nm||"").trim(),group:(st.group&&st.group!="Sin asignar"?st.group:ST.gr||"").trim()}}
function line(v,c){return v?'<i class="f">'+txt(v)+'</i>':'<i'+(c?' class="'+c+'"':'')+'></i>'}
function build(){var B=brand(),A=alumno(),h='';
 ORDER.forEach(function(id){var S=SC(id),C=CH[id]||{};if(/Introducci/.test(C.k||""))return;var n=0,part='';
  var head='<div class="blk"><span>'+txt(C.k||S.t)+'</span>'+(C.t||"")+'</div>';
  lessonIdx(S).forEach(function(i){var t=topic(P[i],(C.l||"")+"."+(n+1),n?"":head);if(t){n++;part+=t}});
  h+=part});
 var mod=B.mod+(B.modName?' · '+B.modName:'');
 return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apuntes '+txt(B.mod+' '+B.ra)+'</title><style>'+CSS+'\n'+illCss()+'</style></head><body>'+
  '<div class="bar"><button onclick="print()">🖨️ Imprimir o guardar PDF</button><span>En celular: toca el botón y elige «Guardar como PDF». Sale en hoja carta, lista para pegar en tu cuaderno.</span></div>'+
  '<div class="sheet"><div class="top"><span>'+txt(mod)+'</span><span>Apuntes · '+txt(B.ra)+'</span></div>'+
  '<div class="cover"><div><h1>'+txt(B.raName)+'</h1></div><div class="who">Nombre'+line(A.name)+'Grupo'+line(A.group,"s")+'</div></div>'+
  '<div class="flow">'+h+'</div><div class="foot"><span>'+txt(B.mod+' · '+B.ra+' · '+B.raName)+'</span><span><em>Ing. Santiago Martínez González</em><b>AulaVirtual</b></span></div></div></body></html>'}
function open(){var html=build(),w=null;try{w=window.open("","_blank")}catch(e){}
 if(w){w.document.open();w.document.write(html);w.document.close();return}
 location.href=URL.createObjectURL(new Blob([html],{type:"text/html"}))}
window.apuntes=open;
var st=document.createElement("style");st.textContent='.crumb .apx{margin-left:auto;border:1.5px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}.crumb .apx:hover{background:var(--pri-soft)}@media (max-width:560px){.crumb .apx{padding:4px 10px;font-size:12px}}';document.head.appendChild(st);

 var b=document.createElement("button");b.className="apx";b.type="button";b.title="Descarga los apuntes de «Aprende» para imprimir y pegar en tu cuaderno";b.textContent="🖨️ Descargar apuntes";b.onclick=open;c.appendChild(b)}})();</script></body></html>
