 el código, la salida y tus explicaciones.<\/p><div class=\"hint\">💡 Usa SIEMPRE los datos de TU escenario en el código: cada programa del reporte debe mostrar esos números en la salida.<\/div><\/section>\n<div class=\"pr\"><span id=\"pt\">0 de 0 pasos<\/span><i id=\"pb\"><\/i><\/div>\n<section><h2>Instrucciones<\/h2><h3>Contexto y conceptos (Bloque A)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>1.<\/b> Describe el sistema asignado y para qué sirve programar en su seguridad.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>2.<\/b> Explica con tus palabras: programa, algoritmo, entrada-proceso-salida y archivo fuente.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>3.<\/b> Indica el lenguaje (Python), si es interpretado o compilado, y las herramientas que usaste.<\/span><\/label><h3>Programas (Bloque B)<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>4.<\/b> Programa 1: variables de los tipos str, int, float y bool con los datos asignados, mostrando el tipo de cada una con type().<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>5.<\/b> Programa 2: cálculo de combinaciones posibles, segundos, horas y minutos para adivinar la contraseña, con los operadores **, /, // y %.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>6.<\/b> Programa 3: variables lógicas con comparaciones y con and, or o not (por ejemplo, ¿la contraseña es segura?), usando input() con conversión.<\/span><\/label><h3>Errores y cierre<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>7.<\/b> Un error de sintaxis y uno de ejecución o de lógica que cometiste: captura, explicación y corrección.<\/span><\/label><label class=\"st\"><input type=\"checkbox\"><span><b>8.<\/b> Conclusión: qué otra tarea de seguridad te gustaría automatizar con programación.<\/span><\/label><h3>Entrega<\/h3><label class=\"st\"><input type=\"checkbox\"><span><b>9.<\/b> Llena las secciones de la actividad en la plataforma y adjunta tu reporte en PDF con el código y las capturas de la salida.<\/span><\/label><\/section>\n<section><h2>Lista de cotejo<\/h2><table><tr><th>Criterio<\/th><th>Pts<\/th><\/tr><tr><td>Contexto y conceptos<\/td><td>15<\/td><\/tr><tr><td>Lenguaje, archivo fuente y herramientas<\/td><td>10<\/td><\/tr><tr><td>Variables y tipos de datos<\/td><td>20<\/td><\/tr><tr><td>Operadores y cálculos con los datos asignados<\/td><td>25<\/td><\/tr><tr><td>Errores explicados y corregidos<\/td><td>15<\/td><\/tr><tr><td>Redacción y presentación del reporte<\/td><td>15<\/td><\/tr><tr><th>Total<\/th><th>100<\/th><\/tr><\/table><\/section>\n<section><h2>Entrega<\/h2><ul><li>Un archivo PDF con tu reporte, tu código y las capturas de la salida.<\/li><li>Se entrega en la actividad R.A. 3.1 de la plataforma, junto con las secciones escritas.<\/li><\/ul><\/section>\n<\/main><script>\nvar c=document.querySelectorAll(\".st input\");function u(){var n=0;c.forEach(function(x){x.parentNode.classList.toggle(\"on\",x.checked);if(x.checked)n++});document.getElementById(\"pt\").textContent=n+\" de \"+c.length+\" pasos\";document.getElementById(\"pb\").style.width=(100*n/c.length)+\"%\"}\nc.forEach(function(x){x.onchange=u});u();\n<\/script><\/body><\/html>";
